<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Global Data Center Atlas</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0b0f1a;--panel:rgba(11,15,26,0.92);--bdr:rgba(0,212,255,0.18);--cyan:#00d4ff;--green:#00ff88;--amber:#fbbf24;--red:#f87171;--text:#c8d6e5;--muted:#5a7085;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:var(--sans);color:var(--text);height:100vh;overflow:hidden}

/* ── Header ── */
#header{position:fixed;top:0;left:0;right:0;height:52px;background:var(--panel);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 20px;gap:16px;z-index:1000;backdrop-filter:blur(12px)}
#header-title{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.18em;color:var(--cyan);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.pulse-dot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 8px var(--green);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 8px var(--green)}50%{opacity:.4;box-shadow:0 0 2px var(--green)}}
#header-count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}
#header-count span{color:var(--cyan)}

/* ── Search + autocomplete ── */
#search-container{position:relative;flex:0 0 300px}
#search-wrap{display:flex;align-items:center;background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:6px;padding:0 10px;height:32px;gap:6px}
#search-wrap svg{color:var(--muted);flex-shrink:0}
#search{background:none;border:none;outline:none;font-family:var(--mono);font-size:11px;color:var(--text);width:100%}
#search::placeholder{color:var(--muted)}
#clear-btn{cursor:pointer;color:var(--muted);font-size:14px;background:none;border:none;padding:0;display:none}
#clear-btn:hover{color:var(--text)}
#search-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#0d1520;border:1px solid var(--bdr);border-radius:8px;z-index:2000;max-height:290px;overflow-y:auto;box-shadow:0 6px 24px rgba(0,0,0,.85);display:none}
#search-dropdown::-webkit-scrollbar{width:4px}
#search-dropdown::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.sd-section{padding:4px 0}
.sd-lbl{font-family:var(--mono);font-size:8px;letter-spacing:.2em;color:var(--muted);padding:6px 12px 3px;text-transform:uppercase}
.sd-item{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;cursor:pointer;transition:background .12s}
.sd-item:hover,.sd-item.focused{background:rgba(0,212,255,.08)}
.sd-name{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.sd-meta{font-family:var(--mono);font-size:10px;color:var(--muted);flex-shrink:0;margin-left:8px}
.sd-div{border-top:1px solid var(--bdr);margin:3px 0}
.sd-place-btn{display:flex;align-items:center;gap:7px;padding:8px 12px;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted);transition:all .12s}
.sd-place-btn:hover{color:var(--cyan);background:rgba(0,212,255,.06)}
.sd-no-results{padding:10px 12px;font-family:var(--mono);font-size:10px;color:var(--muted)}

/* ── Globe ── */
#globe{position:fixed;top:52px;left:0;right:0;bottom:0}

/* ── Side panel ── */
#panel{position:fixed;top:62px;left:12px;width:252px;background:var(--panel);border:1px solid var(--bdr);border-radius:10px;padding:14px;z-index:900;backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto}
#panel::-webkit-scrollbar{width:4px}
#panel::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.panel-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:7px}
.tier-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.tier-label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text)}
.tier-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tier-count{font-family:var(--mono);font-size:11px;color:var(--muted)}
#precision-section{transition:opacity .4s}
#zoom-hint{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--amber);display:none;margin-left:4px}
#country-select{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:11px;padding:6px 8px;outline:none;cursor:pointer}
#country-select option{background:#0b0f1a}
.panel-divider{border:none;border-top:1px solid var(--bdr)}
#reset-btn{background:none;border:1px solid var(--bdr);border-radius:6px;color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:5px 10px;cursor:pointer;width:100%;text-transform:uppercase;transition:all .2s}
#reset-btn:hover{color:var(--cyan);border-color:var(--cyan)}
#result-info{font-family:var(--mono);font-size:10px;color:var(--amber);display:none}
#spec-toggle{background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:5px;padding:0}
#spec-toggle:hover{color:var(--cyan)}
#spec-toggle .arrow{transition:transform .2s}
#spec-toggle.open .arrow{transform:rotate(90deg)}
#spec-panel{display:none}
#spec-panel.open{display:block}
.spec-filter{margin-bottom:10px}
.spec-filter-label{font-size:11px;color:var(--text);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.spec-filter-label .unit{font-family:var(--mono);font-size:9px;color:var(--muted)}
.coverage-badge{font-family:var(--mono);font-size:9px;border-radius:3px;padding:1px 5px;margin-left:auto;flex-shrink:0}
.coverage-badge.low{background:rgba(248,113,113,.12);color:var(--red)}
.coverage-badge.medium{background:rgba(251,191,36,.12);color:var(--amber)}
.coverage-badge.high{background:rgba(0,255,136,.12);color:var(--green)}
.spec-note{font-size:10px;color:var(--muted);line-height:1.5;margin-bottom:10px;padding:7px 9px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.15);border-radius:6px}
.range-row{display:flex;align-items:center;gap:5px}
.range-input{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:10px;padding:4px 6px;outline:none;width:0;min-width:0}
.range-input:focus{border-color:var(--cyan)}
.range-input::placeholder{color:var(--muted)}
.range-sep{font-family:var(--mono);font-size:10px;color:var(--muted);flex-shrink:0}
.require-row{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:10px;color:var(--muted);cursor:pointer}
.require-row input{accent-color:var(--cyan);cursor:pointer}

/* ── Popup ── */
#popup{position:fixed;z-index:850;display:none;min-width:300px;max-width:360px;background:#0d1520;border:1px solid var(--bdr);border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.85);max-height:calc(100vh - 80px);overflow-y:auto}
#popup::-webkit-scrollbar{width:4px}
#popup::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.popup-close{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;z-index:1;padding:2px 6px;border-radius:4px}
.popup-close:hover{color:var(--text);background:rgba(255,255,255,.06)}
.popup-images{display:grid;gap:1px;border-radius:10px 10px 0 0;overflow:hidden;height:130px}
.popup-images.two-col{grid-template-columns:1fr 1fr}
.popup-images.one-col{grid-template-columns:1fr}
.popup-img-wrap{position:relative;overflow:hidden;background:#060b18}
.popup-img-wrap img{width:100%;height:100%;object-fit:cover;transition:opacity .3s;opacity:0}
.popup-img-wrap img.loaded{opacity:1}
.popup-img-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.75));font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:rgba(255,255,255,.7);padding:14px 7px 5px;text-transform:uppercase}
.popup-img-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.1em;text-decoration:none;transition:color .2s}
.popup-img-placeholder:hover{color:var(--cyan)}
.popup-img-placeholder svg{opacity:.3}
.popup-promo-note{padding:6px 14px;background:rgba(0,212,255,.04);border-bottom:1px solid var(--bdr);font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.05em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.popup-sv-compare{font-family:var(--mono);font-size:9px;color:#34d399;text-decoration:none;white-space:nowrap;border:1px solid rgba(52,211,153,.25);border-radius:4px;padding:2px 7px;transition:all .2s;flex-shrink:0}
.popup-sv-compare:hover{background:rgba(52,211,153,.1);border-color:#34d399}
.popup-header{padding:11px 36px 8px 14px;border-bottom:1px solid var(--bdr)}
.popup-name{font-size:13px;font-weight:500;color:#fff;line-height:1.4;margin-bottom:3px}
.popup-country{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
.popup-body{padding:9px 14px 13px}
.popup-row{display:flex;gap:8px;font-size:11px;margin-bottom:5px;line-height:1.5}
.popup-row-lbl{font-family:var(--mono);color:var(--muted);flex-shrink:0;padding-top:1px}
.popup-row-val{color:var(--text);word-break:break-word}
.popup-divider{border:none;border-top:1px solid var(--bdr);margin:7px 0}
.popup-stats{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.popup-chip{font-family:var(--mono);font-size:10px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);border-radius:4px;padding:2px 6px;color:var(--cyan)}
.popup-desc{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:9px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.popup-actions{display:flex;gap:8px;flex-wrap:wrap}
.popup-link{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;text-decoration:none;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:4px 9px;transition:all .2s;color:var(--cyan);border:1px solid rgba(0,212,255,.25);background:rgba(0,212,255,.06)}
.popup-link:hover{background:rgba(0,212,255,.14);border-color:var(--cyan)}
.tier-badge{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;border-radius:3px;padding:1px 5px;text-transform:uppercase;margin-left:6px;vertical-align:middle}
.tier-badge.address{background:rgba(0,255,136,.12);color:var(--green)}
.tier-badge.city{background:rgba(251,191,36,.12);color:var(--amber)}
.tier-badge.country{background:rgba(248,113,113,.12);color:var(--red)}

/* ── Tooltip ── */
#tooltip{position:fixed;z-index:900;display:none;pointer-events:none;background:rgba(11,15,26,.95);border:1px solid var(--bdr);border-radius:6px;font-family:var(--mono);font-size:10px;color:var(--text);padding:5px 9px;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(8px)}

/* ── MapLibre overrides ── */
.maplibregl-ctrl-attrib{background:rgba(11,15,26,.75)!important;color:var(--muted)!important;font-size:9px!important}
.maplibregl-ctrl-attrib a{color:var(--muted)!important}
.maplibregl-ctrl-group{background:var(--panel)!important;border:1px solid var(--bdr)!important;border-radius:8px!important;overflow:hidden}
.maplibregl-ctrl-group button{background:var(--panel)!important;border-bottom:1px solid var(--bdr)!important}
.maplibregl-ctrl-group button:hover{background:rgba(0,212,255,.08)!important}
.maplibregl-ctrl-icon{filter:invert(.6)}
</style>
</head>
<body>

<header id="header">
  <div id="header-title"><div class="pulse-dot"></div>Global Data Center Atlas</div>

  <!-- Search with autocomplete -->
  <div id="search-container">
    <div id="search-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" type="text" placeholder="Country, state, city, or data center…" autocomplete="off" spellcheck="false"/>
      <button id="clear-btn">✕</button>
    </div>
    <div id="search-dropdown"></div>
  </div>

  <div id="header-count">Loading…</div>
</header>

<div id="panel">
  <!-- Precision legend — fades when clusters visible at low zoom -->
  <div id="precision-section">
    <div class="panel-lbl">Precision <span id="zoom-hint">— zoom in to see</span></div>
    <div class="tier-row"><div class="tier-label"><div class="tier-dot" style="background:var(--green);box-shadow:0 0 6px var(--green)"></div>Street address</div><div class="tier-count" id="cnt-address">—</div></div>
    <div class="tier-row"><div class="tier-label"><div class="tier-dot" style="background:var(--amber);box-shadow:0 0 6px var(--amber)"></div>City / town</div><div class="tier-count" id="cnt-city">—</div></div>
    <div class="tier-row"><div class="tier-label"><div class="tier-dot" style="background:var(--red);box-shadow:0 0 6px var(--red)"></div>Country centre</div><div class="tier-count" id="cnt-country">—</div></div>
  </div>
  <hr class="panel-divider"/>
  <div>
    <div class="panel-lbl">Country</div>
    <select id="country-select"><option value="">All countries</option></select>
  </div>
  <hr class="panel-divider"/>
  <div>
    <button id="spec-toggle"><span class="arrow">▶</span> Filter by specs</button>
    <div id="spec-panel">
      <br/>
      <div class="spec-note">⚠ Not all data centers report every stat. The coverage percentage tells you how many DCs we have data for.</div>
      <div class="spec-filter">
        <div class="spec-filter-label">Total Space <span class="unit">sqft</span><span class="coverage-badge" id="cov-space">—</span></div>
        <div class="range-row"><input class="range-input" id="space-min" type="number" min="0" placeholder="Min"/><span class="range-sep">–</span><input class="range-input" id="space-max" type="number" min="0" placeholder="Max"/></div>
        <label class="require-row"><input type="checkbox" id="space-require"/> Only show DCs with size data</label>
      </div>
      <div class="spec-filter">
        <div class="spec-filter-label">Colocation Space <span class="unit">sqft</span><span class="coverage-badge" id="cov-colo">—</span></div>
        <div class="range-row"><input class="range-input" id="colo-min" type="number" min="0" placeholder="Min"/><span class="range-sep">–</span><input class="range-input" id="colo-max" type="number" min="0" placeholder="Max"/></div>
        <label class="require-row"><input type="checkbox" id="colo-require"/> Only show DCs with colo data</label>
      </div>
      <div class="spec-filter">
        <div class="spec-filter-label">Total Power <span class="unit">MW</span><span class="coverage-badge" id="cov-power">—</span></div>
        <div class="range-row"><input class="range-input" id="power-min" type="number" min="0" step="0.1" placeholder="Min"/><span class="range-sep">–</span><input class="range-input" id="power-max" type="number" min="0" step="0.1" placeholder="Max"/></div>
        <label class="require-row"><input type="checkbox" id="power-require"/> Only show DCs with power data</label>
      </div>
    </div>
  </div>
  <hr class="panel-divider"/>
  <button id="reset-btn">Reset all filters</button>
  <div id="result-info"></div>
</div>

<div id="globe"></div>
<div id="popup"></div>
<div id="tooltip"></div>

<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script>
window.addEventListener('load', function () {

// ── Map ────────────────────────────────────────────────────────────────────
const CLUSTER_ZOOM = 9; // zoom at which clusters dissolve into individual dots

const map = new maplibregl.Map({
  container: 'globe',
  style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center: [10, 20],
  zoom: 1.8,
  maxZoom: 20,          // allow full street-level zoom
  projection: 'globe',
  antialias: true,
  attributionControl: false,
});
map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

// ── Auto-rotation (pauses on interaction, resumes after 4 s) ───────────────
let rotating = true, rotateTimer, lastTs = null;
const DEGS_PER_SEC = 3;

(function spin(ts) {
  if (lastTs !== null && rotating && !map.isMoving()) {
    const dt = (ts - lastTs) / 1000;
    const c  = map.getCenter();
    map.jumpTo({ center: [c.lng - DEGS_PER_SEC * dt, c.lat] });
  }
  lastTs = ts;
  requestAnimationFrame(spin);
})(0);

function stopSpin()  { rotating = false; clearTimeout(rotateTimer); lastTs = null; }
function startSpin() { rotateTimer = setTimeout(() => { rotating = true; lastTs = null; }, 4000); }
map.on('mousedown', stopSpin); map.on('touchstart', stopSpin);
map.on('mouseup',   startSpin); map.on('touchend',  startSpin);
map.on('wheel', stopSpin); map.on('zoomstart', stopSpin); map.on('zoomend', startSpin);

// ── Helpers ────────────────────────────────────────────────────────────────
function parseSqft(v){if(!v)return null;const m=String(v).replace(/,/g,'').match(/(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):null}
function parseMW(v){if(!v)return null;const m=String(v).replace(/,/g,'').match(/(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):null}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// ── Popup ──────────────────────────────────────────────────────────────────
const popupEl   = document.getElementById('popup');
const tooltipEl = document.getElementById('tooltip');

function buildPopup(d) {
  const SL = {'total space':'Total Space','colocation space':'Colo Space','total power':'Total Power','to nearest airport':'Nearest Airport'};
  const chips = Object.entries(SL).filter(([k])=>d[k]).map(([k,l])=>`<div class="popup-chip">${esc(d[k])} <span style="opacity:.6">${l}</span></div>`).join('');
  const badge = `<span class="tier-badge ${d.tier||'country'}">${{address:'Exact',city:'City',country:'Country'}[d.tier]||'Country'}</span>`;
  const addr  = d.address?`<div class="popup-row"><div class="popup-row-lbl">ADDR</div><div class="popup-row-val">${esc(d.address)}</div></div>`:'';
  const desc  = d.description?`<hr class="popup-divider"><div class="popup-desc">${esc(d.description)}</div>`:'';
  const exact = d.tier==='address';
  const svUrl = exact?`https://www.google.com/maps?q=${d.lat},${d.lng}&layer=c&cbll=${d.lat},${d.lng}`:null;

  let images='', promoNote='';
  if (d.image_url) {
    if (exact) {
      images=`<div class="popup-images two-col">
        <div class="popup-img-wrap">
          <img src="${esc(d.image_url)}" alt="" onload="this.classList.add('loaded')" onerror="this.parentElement.innerHTML='<span class=popup-img-placeholder>No image</span>'"/>
          <div class="popup-img-label">Official</div>
        </div>
        <a class="popup-img-wrap popup-img-placeholder" href="${esc(svUrl)}" target="_blank" rel="noopener">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>
          Street View →<div class="popup-img-label">Compare</div>
        </a></div>
      <div class="popup-promo-note">
        📸 Promotional image — datacenters.com
        <a class="popup-sv-compare" href="${esc(svUrl)}" target="_blank" rel="noopener">Compare with Street View →</a>
      </div>`;
    } else {
      images=`<div class="popup-images one-col">
        <div class="popup-img-wrap">
          <img src="${esc(d.image_url)}" alt="" onload="this.classList.add('loaded')" onerror="this.parentElement.innerHTML='<span class=popup-img-placeholder>No image</span>'"/>
          <div class="popup-img-label">Official</div>
        </div></div>
      <div class="popup-promo-note">📸 Promotional image provided by datacenters.com</div>`;
    }
  }

  const dcLink=d.page_url?`<a class="popup-link" href="${esc(d.page_url)}" target="_blank" rel="noopener">datacenters.com <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>`:'';

  return `${images}
    <button class="popup-close" onclick="document.getElementById('popup').style.display='none'">×</button>
    <div class="popup-header"><div class="popup-name">${esc(d.name)}${badge}</div><div class="popup-country">${esc(d.country)}</div></div>
    <div class="popup-body">${addr}${chips?`<div class="popup-stats">${chips}</div>`:''}${desc}<div class="popup-actions">${dcLink}</div></div>`;
}

function showPopup(d, cx, cy) {
  popupEl.innerHTML = buildPopup(d);
  popupEl.style.display = 'block';
  requestAnimationFrame(() => {
    const pw=popupEl.offsetWidth||340, ph=popupEl.offsetHeight||420;
    let x=cx+18, y=cy-24;
    if(x+pw>window.innerWidth-8)  x=cx-pw-18;
    if(y+ph>window.innerHeight-8) y=window.innerHeight-ph-8;
    if(y<60)y=60; if(x<8)x=8;
    popupEl.style.left=x+'px'; popupEl.style.top=y+'px';
  });
}

// ── Data + search index ────────────────────────────────────────────────────
let allPoints  = [];
let countryCounts = {}; // country → count
let countries  = new Set();

// ── Zoom-based legend visibility ───────────────────────────────────────────
function updateLegendForZoom(zoom) {
  const section  = document.getElementById('precision-section');
  const zoomHint = document.getElementById('zoom-hint');
  if (zoom >= CLUSTER_ZOOM) {
    section.style.opacity  = '1';
    zoomHint.style.display = 'none';
  } else {
    section.style.opacity  = '0.4';
    zoomHint.style.display = 'inline';
  }
}
map.on('zoom', () => updateLegendForZoom(map.getZoom()));

// ── Style load: add sources, layers, events ────────────────────────────────
map.on('style.load', () => {

  map.setFog({'color':'#0b0f1a','high-color':'#142230','space-color':'#0b0f1a','horizon-blend':0.03,'star-intensity':0.08});

  // GeoJSON source with clustering
  map.addSource('datacenters', {
    type: 'geojson',
    data: { type:'FeatureCollection', features:[] },
    cluster: true,
    clusterMaxZoom: CLUSTER_ZOOM - 1,   // clusters dissolve at CLUSTER_ZOOM
    clusterRadius: 48,
  });

  // ── Far-view layers: amber glow + count ───────────────────────────────────
  // Outer glow (blurred halo)
  map.addLayer({ id:'cluster-glow', type:'circle', source:'datacenters',
    filter:['has','point_count'],
    paint:{
      'circle-color':['interpolate',['linear'],['get','point_count'],
        1,'rgba(255,195,80,0.12)',50,'rgba(255,175,60,0.17)',500,'rgba(255,155,50,0.22)'],
      'circle-radius':['interpolate',['linear'],['get','point_count'],
        1,18,10,32,100,52,1000,80],
      'circle-blur':0.95,
    }
  });
  // Core circle
  map.addLayer({ id:'cluster-core', type:'circle', source:'datacenters',
    filter:['has','point_count'],
    paint:{
      'circle-color':['interpolate',['linear'],['get','point_count'],
        1,'rgba(255,205,110,0.78)',50,'rgba(255,185,80,0.82)',500,'rgba(255,165,65,0.88)'],
      'circle-radius':['interpolate',['linear'],['get','point_count'],
        1,9,10,15,100,24,1000,38],
      'circle-stroke-color':['interpolate',['linear'],['get','point_count'],
        1,'rgba(255,210,130,0.4)',100,'rgba(255,180,80,0.5)'],
      'circle-stroke-width':2,
    }
  });
  // Count text
  map.addLayer({ id:'cluster-count', type:'symbol', source:'datacenters',
    filter:['has','point_count'],
    layout:{
      'text-field':['get','point_count_abbreviated'],
      'text-font':['Open Sans Bold','Arial Unicode MS Bold'],
      'text-size':['interpolate',['linear'],['zoom'],1,10,6,13],
      'text-allow-overlap':false,
    },
    paint:{'text-color':'#fff','text-halo-color':'rgba(0,0,0,0.6)','text-halo-width':1.5}
  });

  // ── Close-view layer: precision color-coded dots ───────────────────────────
  map.addLayer({ id:'dc-circles', type:'circle', source:'datacenters',
    filter:['!',['has','point_count']],
    paint:{
      'circle-radius':['interpolate',['linear'],['zoom'],
        4,3, 8,4.5, 12,6.5, 16,9],
      // Below CLUSTER_ZOOM: warm amber light; at or above: precision colour
      'circle-color':['step',['zoom'],
        'rgba(255,200,100,0.85)',   // far view — warm light, no precision coding
        CLUSTER_ZOOM,              // threshold
        ['match',['get','tier'],'address','#00ff88','city','#fbbf24','#f87171']
      ],
      'circle-opacity':0.88,
      'circle-stroke-color':['step',['zoom'],
        'rgba(255,200,100,0.2)', CLUSTER_ZOOM, 'rgba(255,255,255,0.22)'],
      'circle-stroke-width':0.8,
      'circle-blur':['step',['zoom'],0.25, CLUSTER_ZOOM, 0],
    }
  });

  // ── Cluster click → zoom to expand ────────────────────────────────────────
  map.on('click','cluster-core', e => {
    const f = map.queryRenderedFeatures(e.point,{layers:['cluster-core','cluster-glow']});
    if(!f.length) return;
    stopSpin();
    const cid = f[0].properties.cluster_id;
    map.getSource('datacenters').getClusterExpansionZoom(cid, (err,zoom) => {
      if(err) return;
      map.easeTo({center:f[0].geometry.coordinates, zoom:zoom+0.5, duration:600});
    });
  });
  map.on('mouseenter','cluster-core', ()=>{ map.getCanvas().style.cursor='pointer'; });
  map.on('mouseleave','cluster-core', ()=>{ map.getCanvas().style.cursor=''; });

  // ── Individual DC click → popup ───────────────────────────────────────────
  map.on('click','dc-circles', e => {
    if(!e.features.length) return;
    stopSpin();
    showPopup(e.features[0].properties, e.point.x, e.point.y);
  });
  map.on('click', e => {
    const f=map.queryRenderedFeatures(e.point,{layers:['dc-circles','cluster-core']});
    if(!f.length) popupEl.style.display='none';
  });

  // ── Hover tooltip ─────────────────────────────────────────────────────────
  map.on('mouseenter','dc-circles', e => {
    map.getCanvas().style.cursor='pointer';
    if(e.features.length){ tooltipEl.textContent=e.features[0].properties.name; tooltipEl.style.display='block'; }
  });
  map.on('mousemove','dc-circles', e => {
    tooltipEl.style.left=(e.point.x+14)+'px'; tooltipEl.style.top=(e.point.y-32)+'px';
    if(e.features.length) tooltipEl.textContent=e.features[0].properties.name;
  });
  map.on('mouseleave','dc-circles', ()=>{ map.getCanvas().style.cursor=''; tooltipEl.style.display='none'; });

  // ── Load GeoJSON ──────────────────────────────────────────────────────────
  fetch('datacenters.geojson')
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(geojson => {
      const feats=geojson.features||[];
      const tiers={address:0,city:0,country:0};

      allPoints = feats.map(f => {
        const p=f.properties;
        const t=p.tier||'country';
        if(t in tiers) tiers[t]++;
        countries.add(p.country);
        countryCounts[p.country]=(countryCounts[p.country]||0)+1;
        return {
          lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0],
          ...p,
          _space:parseSqft(p['total space']),
          _colo:parseSqft(p['colocation space']),
          _power:parseMW(p['total power']),
        };
      });

      pushToMap(allPoints);

      // Header
      document.getElementById('header-count').innerHTML=
        `<span>${feats.length.toLocaleString()}</span> data centers · <span>${countries.size}</span> countries`;
      document.getElementById('cnt-address').textContent=tiers.address.toLocaleString();
      document.getElementById('cnt-city').textContent=tiers.city.toLocaleString();
      document.getElementById('cnt-country').textContent=tiers.country.toLocaleString();
      updateLegendForZoom(map.getZoom());

      // Coverage badges
      const total=feats.length;
      [['space','total space','cov-space'],['colo','colocation space','cov-colo'],['power','total power','cov-power']].forEach(([,key,id])=>{
        const n=allPoints.filter(d=>d[key]).length;
        const pct=Math.round(n/total*100);
        const el=document.getElementById(id);
        el.textContent=pct+'% of DCs';
        el.className='coverage-badge '+(pct>=60?'high':pct>=30?'medium':'low');
      });

      // Country dropdown — sorted by count desc, then alphabetically
      const sel=document.getElementById('country-select');
      [...countries]
        .sort((a,b)=>{
          const diff=(countryCounts[b]||0)-(countryCounts[a]||0);
          return diff!==0?diff:a.localeCompare(b);
        })
        .forEach(c=>{
          const o=document.createElement('option');
          o.value=c;
          o.textContent=`${c} (${(countryCounts[c]||0).toLocaleString()})`;
          sel.appendChild(o);
        });
    })
    .catch(err=>{
      document.getElementById('header-count').textContent='Could not load datacenters.geojson — see README';
      console.error(err);
    });
});

// Push filtered array to MapLibre GeoJSON source
function pushToMap(pts) {
  const src=map.getSource('datacenters');
  if(!src) return;
  src.setData({
    type:'FeatureCollection',
    features:pts.map(d=>({
      type:'Feature',
      geometry:{type:'Point',coordinates:[d.lng,d.lat]},
      properties:d,
    })),
  });
}

// ── Search autocomplete ────────────────────────────────────────────────────
const searchEl   = document.getElementById('search');
const clearBtn   = document.getElementById('clear-btn');
const dropdown   = document.getElementById('search-dropdown');
let searchMode   = 'filter';  // 'filter' | 'location'
let searchDebounce;

function closeDropdown() { dropdown.style.display='none'; }
function openDropdown()  { dropdown.style.display='block'; }

searchEl.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  const q = searchEl.value.trim();
  clearBtn.style.display = q ? 'block' : 'none';

  if (!q) { closeDropdown(); applyFilters(); searchMode='filter'; return; }

  searchDebounce = setTimeout(() => showSuggestions(q), 180);
});

searchEl.addEventListener('keydown', e => {
  if(e.key==='Escape'){ closeDropdown(); searchEl.blur(); }
});

document.addEventListener('click', e => {
  if(!document.getElementById('search-container').contains(e.target)) closeDropdown();
});

function showSuggestions(q) {
  const ql = q.toLowerCase();
  const html = [];

  // Countries
  const matchCountries = [...countries]
    .filter(c=>c.toLowerCase().includes(ql))
    .sort((a,b)=>(countryCounts[b]||0)-(countryCounts[a]||0))
    .slice(0,6);

  if(matchCountries.length) {
    html.push('<div class="sd-section"><div class="sd-lbl">Countries</div>');
    matchCountries.forEach(c=>{
      html.push(`<div class="sd-item" data-type="country" data-value="${esc(c)}">
        <span class="sd-name">${esc(c)}</span>
        <span class="sd-meta">${(countryCounts[c]||0).toLocaleString()} DCs</span></div>`);
    });
    html.push('</div>');
  }

  // Specific data centers
  const matchDCs = allPoints
    .filter(d=>d.name.toLowerCase().includes(ql)||
               (d.address||'').toLowerCase().includes(ql))
    .slice(0,6);

  if(matchDCs.length) {
    if(html.length) html.push('<div class="sd-div"></div>');
    html.push('<div class="sd-section"><div class="sd-lbl">Data Centers</div>');
    matchDCs.forEach((d,i)=>{
      html.push(`<div class="sd-item" data-type="dc" data-lat="${d.lat}" data-lng="${d.lng}" data-idx="${allPoints.indexOf(d)}">
        <span class="sd-name">${esc(d.name)}</span>
        <span class="sd-meta">${esc(d.country)}</span></div>`);
    });
    html.push('</div>');
  }

  // No local matches
  if(!matchCountries.length && !matchDCs.length) {
    html.push('<div class="sd-no-results">No matching countries or data centers</div>');
  }

  // Always offer a place search
  html.push(`<div class="sd-div"></div>
    <div class="sd-place-btn" id="sd-nominatim">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Search "<strong>${esc(q)}</strong>" as a place
    </div>`);

  dropdown.innerHTML = html.join('');
  openDropdown();

  // Wire clicks
  dropdown.querySelectorAll('.sd-item[data-type="country"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const country = el.dataset.value;
      searchEl.value = country;
      closeDropdown();
      clearBtn.style.display='block';
      selectCountry(country);
    });
  });

  dropdown.querySelectorAll('.sd-item[data-type="dc"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.dataset.idx);
      const d   = allPoints[idx];
      if(!d) return;
      closeDropdown();
      searchEl.value='';
      clearBtn.style.display='none';
      stopSpin();
      map.flyTo({ center:[d.lng,d.lat], zoom:14, duration:1400 });
      setTimeout(()=>showPopup(d, window.innerWidth/2, window.innerHeight/2), 800);
    });
  });

  const nominatimBtn = document.getElementById('sd-nominatim');
  if(nominatimBtn) nominatimBtn.addEventListener('click', ()=>nominatimSearch(q));
}

function selectCountry(country) {
  // Apply country filter AND fly to centroid of that country's DCs
  document.getElementById('country-select').value=country;
  activeCountry=country;
  applyFilters();
  const pts=allPoints.filter(d=>d.country===country);
  if(pts.length) {
    const lats=pts.map(d=>d.lat), lngs=pts.map(d=>d.lng);
    const bounds=[[Math.min(...lngs),Math.min(...lats)],[Math.max(...lngs),Math.max(...lats)]];
    map.fitBounds(bounds,{padding:80,maxZoom:6,duration:1200});
  }
}

function nominatimSearch(q) {
  closeDropdown();
  searchEl.value=q; clearBtn.style.display='block';
  const url=`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&addressdetails=0`;
  fetch(url)
    .then(r=>r.json())
    .then(results=>{
      if(!results.length){ alert(`No place found for "${q}"`); return; }
      const r=results[0];
      const bb=r.boundingbox.map(parseFloat);
      // Nominatim bbox: [minlat, maxlat, minlng, maxlng]
      map.fitBounds([
        [bb[2],bb[0]], // SW [lng,lat]
        [bb[3],bb[1]], // NE [lng,lat]
      ], { padding:60, maxZoom:14, duration:1400 });
    })
    .catch(()=>alert('Place search failed. Try a different search term.'));
}

// ── Filter logic ───────────────────────────────────────────────────────────
let activeCountry='', activeSearch='';

function getSpecFilters(){
  const n=v=>v===''?null:parseFloat(v);
  return{
    space:{min:n(document.getElementById('space-min').value),max:n(document.getElementById('space-max').value),req:document.getElementById('space-require').checked},
    colo: {min:n(document.getElementById('colo-min').value), max:n(document.getElementById('colo-max').value), req:document.getElementById('colo-require').checked},
    power:{min:n(document.getElementById('power-min').value),max:n(document.getElementById('power-max').value),req:document.getElementById('power-require').checked},
  };
}
function matchSpec(val,f){
  if(f.req&&val===null)return false;
  if(val===null)return true;
  if(f.min!==null&&val<f.min)return false;
  if(f.max!==null&&val>f.max)return false;
  return true;
}

function applyFilters(){
  const q=activeSearch.toLowerCase().trim();
  const spec=getSpecFilters();
  const matches=allPoints.filter(d=>{
    if(activeCountry&&d.country!==activeCountry)return false;
    if(q&&![(d.name||''),(d.country||''),(d.address||'')].some(s=>s.toLowerCase().includes(q)))return false;
    if(!matchSpec(d._space,spec.space))return false;
    if(!matchSpec(d._colo, spec.colo)) return false;
    if(!matchSpec(d._power,spec.power))return false;
    return true;
  });
  pushToMap(matches);
  popupEl.style.display='none';
  const hasFilter=q||activeCountry||Object.values(spec).some(f=>f.min!==null||f.max!==null||f.req);
  const info=document.getElementById('result-info');
  if(hasFilter){info.style.display='block';info.textContent=matches.length.toLocaleString()+' results';}
  else info.style.display='none';
}

// ── Country dropdown ───────────────────────────────────────────────────────
document.getElementById('country-select').addEventListener('change',e=>{
  closeDropdown();
  if(e.target.value){
    selectCountry(e.target.value);
  } else {
    activeCountry='';
    applyFilters();
  }
});

// ── Clear / reset ──────────────────────────────────────────────────────────
clearBtn.addEventListener('click',()=>{
  searchEl.value=''; activeSearch=''; clearBtn.style.display='none'; closeDropdown(); applyFilters();
});
document.getElementById('spec-toggle').addEventListener('click',function(){this.classList.toggle('open');document.getElementById('spec-panel').classList.toggle('open');});
['space-min','space-max','colo-min','colo-max','power-min','power-max'].forEach(id=>document.getElementById(id).addEventListener('input',applyFilters));
['space-require','colo-require','power-require'].forEach(id=>document.getElementById(id).addEventListener('change',applyFilters));
document.getElementById('reset-btn').addEventListener('click',()=>{
  searchEl.value=''; activeSearch=''; activeCountry=''; clearBtn.style.display='none';
  document.getElementById('country-select').value='';
  document.getElementById('result-info').style.display='none';
  closeDropdown();
  ['space-min','space-max','colo-min','colo-max','power-min','power-max'].forEach(id=>document.getElementById(id).value='');
  ['space-require','colo-require','power-require'].forEach(id=>document.getElementById(id).checked=false);
  pushToMap(allPoints);
  popupEl.style.display='none';
  map.flyTo({center:[10,20],zoom:1.8,duration:1200});
});

}); // end load
</script>
