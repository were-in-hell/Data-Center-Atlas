<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Global Data Center Atlas</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

<style>
:root {
  --bg:      #0b0f1a;
  --panel:   rgba(11,15,26,0.92);
  --border:  rgba(0,212,255,0.18);
  --cyan:    #00d4ff;
  --green:   #00ff88;
  --amber:   #fbbf24;
  --red:     #f87171;
  --text:    #c8d6e5;
  --muted:   #5a7085;
  --mono:    'IBM Plex Mono', monospace;
  --sans:    'IBM Plex Sans', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  font-family: var(--sans);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}

/* ── Header ─────────────────────────────────────────────────────────── */
#header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 52px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  z-index: 1000;
  backdrop-filter: blur(12px);
}

#header-title {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--cyan);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 10px;
}

.pulse-dot {
  width: 7px; height: 7px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--green);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; box-shadow: 0 0 8px var(--green); }
  50%      { opacity: 0.4; box-shadow: 0 0 2px var(--green); }
}

#header-count {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  margin-left: auto;
}
#header-count span { color: var(--cyan); }

/* ── Search bar ──────────────────────────────────────────────────────── */
#search-wrap {
  display: flex;
  align-items: center;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0 10px;
  height: 32px;
  gap: 6px;
  flex: 0 0 260px;
}
#search-wrap svg { color: var(--muted); flex-shrink: 0; }
#search {
  background: none;
  border: none;
  outline: none;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text);
  width: 100%;
}
#search::placeholder { color: var(--muted); }
#clear-btn {
  cursor: pointer;
  color: var(--muted);
  font-size: 14px;
  line-height: 1;
  background: none;
  border: none;
  padding: 0;
  display: none;
}
#clear-btn:hover { color: var(--text); }

/* ── Map ─────────────────────────────────────────────────────────────── */
#map {
  position: fixed;
  top: 52px; left: 0; right: 0; bottom: 0;
}

/* ── Side panel ──────────────────────────────────────────────────────── */
#panel {
  position: fixed;
  top: 62px;
  left: 12px;
  width: 240px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  z-index: 900;
  backdrop-filter: blur(12px);
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.panel-section-label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.tier-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 7px;
}
.tier-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--text);
}
.tier-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.tier-count {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}

/* country filter */
#country-select {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 11px;
  padding: 6px 8px;
  outline: none;
  cursor: pointer;
}
#country-select option { background: #0b0f1a; }

#reset-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  padding: 5px 10px;
  cursor: pointer;
  width: 100%;
  text-transform: uppercase;
  transition: all .2s;
}
#reset-btn:hover { color: var(--cyan); border-color: var(--cyan); }

#result-info {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--amber);
  display: none;
}

/* ── Cluster icons ───────────────────────────────────────────────────── */
.custom-cluster {
  background: transparent !important;
  border: none !important;
}
.cluster-inner {
  background: rgba(0,212,255,0.12);
  border: 1.5px solid rgba(0,212,255,0.5);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-weight: 700;
  color: var(--cyan);
  transition: all .2s;
}

/* ── Popup ───────────────────────────────────────────────────────────── */
.leaflet-popup-content-wrapper {
  background: #0d1520;
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  padding: 0;
  min-width: 280px;
  max-width: 340px;
}
.leaflet-popup-content { margin: 0; }
.leaflet-popup-tip { background: #0d1520; }
.leaflet-popup-close-button {
  color: var(--muted) !important;
  font-size: 16px !important;
  top: 8px !important; right: 8px !important;
}
.leaflet-popup-close-button:hover { color: var(--text) !important; }

.popup-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
}
.popup-name {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  color: #fff;
  line-height: 1.4;
  margin-bottom: 4px;
}
.popup-country {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.08em;
}

.popup-body { padding: 10px 16px 14px; }

.popup-row {
  display: flex;
  gap: 8px;
  font-size: 11px;
  margin-bottom: 6px;
  line-height: 1.5;
}
.popup-row-label {
  font-family: var(--mono);
  color: var(--muted);
  flex-shrink: 0;
  padding-top: 1px;
}
.popup-row-value { color: var(--text); word-break: break-word; }

.popup-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 8px 0;
}

.popup-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}
.popup-stat-chip {
  font-family: var(--mono);
  font-size: 10px;
  background: rgba(0,212,255,0.08);
  border: 1px solid rgba(0,212,255,0.2);
  border-radius: 4px;
  padding: 3px 7px;
  color: var(--cyan);
}

.popup-desc {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 10px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.popup-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--cyan);
  text-decoration: none;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.8;
  transition: opacity .2s;
}
.popup-link:hover { opacity: 1; }

.tier-badge {
  display: inline-block;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.1em;
  border-radius: 3px;
  padding: 1px 5px;
  text-transform: uppercase;
  margin-left: 6px;
  vertical-align: middle;
}
.tier-badge.address { background: rgba(0,255,136,0.12); color: var(--green); }
.tier-badge.city    { background: rgba(251,191,36,0.12); color: var(--amber); }
.tier-badge.country { background: rgba(248,113,113,0.12); color: var(--red); }

/* ── Override Leaflet defaults ───────────────────────────────────────── */
.leaflet-control-zoom {
  border: 1px solid var(--border) !important;
  border-radius: 8px !important;
  overflow: hidden;
}
.leaflet-control-zoom a {
  background: var(--panel) !important;
  color: var(--text) !important;
  border-bottom: 1px solid var(--border) !important;
}
.leaflet-control-zoom a:hover { background: rgba(0,212,255,0.1) !important; }
.leaflet-control-attribution {
  background: rgba(11,15,26,0.7) !important;
  color: var(--muted) !important;
  font-size: 9px !important;
  backdrop-filter: blur(6px);
}
.leaflet-control-attribution a { color: var(--muted) !important; }
</style>
</head>
<body>

<!-- Header -->
<header id="header">
  <div id="header-title">
    <div class="pulse-dot"></div>
    Global Data Center Atlas
  </div>

  <!-- Search -->
  <div id="search-wrap">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="search" type="text" placeholder="Search name, country, address…" autocomplete="off"/>
    <button id="clear-btn" title="Clear">✕</button>
  </div>

  <div id="header-count">Loading…</div>
</header>

<!-- Map -->
<div id="map"></div>

<!-- Side panel -->
<div id="panel">
  <div>
    <div class="panel-section-label">Precision</div>
    <div class="tier-row">
      <div class="tier-label">
        <div class="tier-dot" style="background:var(--green);box-shadow:0 0 6px var(--green)"></div>
        Street address
      </div>
      <div class="tier-count" id="cnt-address">—</div>
    </div>
    <div class="tier-row">
      <div class="tier-label">
        <div class="tier-dot" style="background:var(--amber);box-shadow:0 0 6px var(--amber)"></div>
        City / town
      </div>
      <div class="tier-count" id="cnt-city">—</div>
    </div>
    <div class="tier-row">
      <div class="tier-label">
        <div class="tier-dot" style="background:var(--red);box-shadow:0 0 6px var(--red)"></div>
        Country centre
      </div>
      <div class="tier-count" id="cnt-country">—</div>
    </div>
  </div>

  <div>
    <div class="panel-section-label">Filter by country</div>
    <select id="country-select">
      <option value="">All countries</option>
    </select>
  </div>

  <button id="reset-btn">Reset all filters</button>
  <div id="result-info"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
// ── Map init ──────────────────────────────────────────────────────────────────
const map = L.map('map', {
  center: [20, 10],
  zoom: 2,
  zoomControl: false,
  preferCanvas: true,
});

L.control.zoom({ position: 'bottomright' }).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OSM</a> © <a href="https://carto.com">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19,
}).addTo(map);

// ── Colours ───────────────────────────────────────────────────────────────────
const TIER_COLOR = {
  address: '#00ff88',
  city:    '#fbbf24',
  country: '#f87171',
  unknown: '#f87171',
};

// ── Cluster group ─────────────────────────────────────────────────────────────
const clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 50,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  iconCreateFunction(cluster) {
    const n = cluster.getChildCount();
    const size = n > 1000 ? 52 : n > 100 ? 42 : 34;
    return L.divIcon({
      html: `<div class="cluster-inner" style="width:${size}px;height:${size}px;font-size:${size < 40 ? 11 : 13}px">${n.toLocaleString()}</div>`,
      className: 'custom-cluster',
      iconSize: [size, size],
      iconAnchor: [size/2, size/2],
    });
  },
});
map.addLayer(clusterGroup);

// ── Popup builder ─────────────────────────────────────────────────────────────
function buildPopup(p) {
  const statKeys = ['total space','colocation space','total power','to nearest airport'];
  const stats = statKeys
    .filter(k => p[k])
    .map(k => `<div class="popup-stat-chip">${p[k]} ${k}</div>`)
    .join('');

  const tierLabel = { address: 'Exact', city: 'City', country: 'Country', unknown: 'Country' };
  const badge = `<span class="tier-badge ${p.tier || 'country'}">${tierLabel[p.tier] || 'Country'}</span>`;

  const addr = p.address
    ? `<div class="popup-row"><div class="popup-row-label">ADDR</div><div class="popup-row-value">${esc(p.address)}</div></div>`
    : '';

  const desc = p.description
    ? `<hr class="popup-divider"><div class="popup-desc">${esc(p.description)}</div>`
    : '';

  const link = p.page_url
    ? `<a class="popup-link" href="${esc(p.page_url)}" target="_blank" rel="noopener">
         View on datacenters.com
         <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
           <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
           <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
         </svg>
       </a>`
    : '';

  return `
    <div class="popup-header">
      <div class="popup-name">${esc(p.name)}${badge}</div>
      <div class="popup-country">${esc(p.country)}</div>
    </div>
    <div class="popup-body">
      ${addr}
      ${stats ? `<div class="popup-stats">${stats}</div>` : ''}
      ${desc}
      ${link}
    </div>`;
}

function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── Data loading ──────────────────────────────────────────────────────────────
let allMarkers = [];   // [{marker, props}, …]
let countries   = new Set();

fetch('datacenters.geojson')
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })
  .then(geojson => {
    const features = geojson.features || [];

    // Tier counts
    const tiers = { address: 0, city: 0, country: 0 };

    features.forEach(f => {
      const [lng, lat] = f.geometry.coordinates;
      const p = f.properties;

      countries.add(p.country);
      const t = p.tier || 'country';
      if (t in tiers) tiers[t]++;

      const marker = L.circleMarker([lat, lng], {
        radius: 5,
        fillColor: TIER_COLOR[t] || TIER_COLOR.country,
        fillOpacity: 0.85,
        color: 'rgba(255,255,255,0.3)',
        weight: 1,
      }).bindPopup(buildPopup(p), { maxWidth: 340, minWidth: 280 });

      allMarkers.push({ marker, props: p });
      clusterGroup.addLayer(marker);
    });

    // Header count
    document.getElementById('header-count').innerHTML =
      `<span>${features.length.toLocaleString()}</span> data centers · <span>${countries.size}</span> countries`;

    // Tier counts
    const fmt = n => n.toLocaleString();
    document.getElementById('cnt-address').textContent = fmt(tiers.address);
    document.getElementById('cnt-city').textContent    = fmt(tiers.city);
    document.getElementById('cnt-country').textContent = fmt(tiers.country);

    // Populate country dropdown (sorted)
    const sel = document.getElementById('country-select');
    [...countries].sort().forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      sel.appendChild(opt);
    });
  })
  .catch(err => {
    console.error('Failed to load datacenters.geojson:', err);
    document.getElementById('header-count').textContent =
      'Could not load datacenters.geojson — see README';
  });

// ── Search & filter ───────────────────────────────────────────────────────────
let activeCountry = '';
let activeSearch  = '';

function applyFilters() {
  const q       = activeSearch.toLowerCase().trim();
  const country = activeCountry;

  clusterGroup.clearLayers();

  const matches = allMarkers.filter(({ props: p }) => {
    const countryOk = !country || p.country === country;
    const searchOk  = !q
      || (p.name    || '').toLowerCase().includes(q)
      || (p.country || '').toLowerCase().includes(q)
      || (p.address || '').toLowerCase().includes(q);
    return countryOk && searchOk;
  });

  matches.forEach(({ marker }) => clusterGroup.addLayer(marker));

  const info = document.getElementById('result-info');
  if (q || country) {
    info.style.display = 'block';
    info.textContent   = `${matches.length.toLocaleString()} results`;
    if (matches.length && (q || country)) {
      const bounds = L.latLngBounds(
        matches.slice(0, 500).map(({ marker }) => marker.getLatLng())
      );
      map.fitBounds(bounds, { padding: [40, 40], maxZoom: 8 });
    }
  } else {
    info.style.display = 'none';
  }
}

// Search input
const searchEl = document.getElementById('search');
const clearBtn = document.getElementById('clear-btn');

searchEl.addEventListener('input', () => {
  activeSearch = searchEl.value;
  clearBtn.style.display = activeSearch ? 'block' : 'none';
  applyFilters();
});

clearBtn.addEventListener('click', () => {
  searchEl.value = '';
  activeSearch   = '';
  clearBtn.style.display = 'none';
  applyFilters();
});

// Country filter
document.getElementById('country-select').addEventListener('change', e => {
  activeCountry = e.target.value;
  applyFilters();
});

// Reset
document.getElementById('reset-btn').addEventListener('click', () => {
  searchEl.value = '';
  activeSearch   = '';
  activeCountry  = '';
  clearBtn.style.display = 'none';
  document.getElementById('country-select').value = '';
  document.getElementById('result-info').style.display = 'none';
  clusterGroup.clearLayers();
  allMarkers.forEach(({ marker }) => clusterGroup.addLayer(marker));
  map.setView([20, 10], 2);
});
</script>
</body>
</html>
