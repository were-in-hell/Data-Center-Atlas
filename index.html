<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Global Data Center Atlas</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0b0f1a;--panel:rgba(11,15,26,0.92);--bdr:rgba(0,212,255,0.18);--cyan:#00d4ff;--green:#00ff88;--amber:#fbbf24;--red:#f87171;--text:#c8d6e5;--muted:#5a7085}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'IBM Plex Sans',sans-serif;color:var(--text);height:100vh;overflow:hidden}
#header{position:fixed;top:0;left:0;right:0;height:52px;background:var(--panel);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 20px;gap:16px;z-index:1000;backdrop-filter:blur(12px)}
#header-title{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;letter-spacing:.18em;color:var(--cyan);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.pulse-dot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 8px var(--green);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 8px var(--green)}50%{opacity:.4;box-shadow:0 0 2px var(--green)}}
#header-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-left:auto}
#header-count span{color:var(--cyan)}
#search-container{position:relative;flex:0 0 300px}
#search-wrap{display:flex;align-items:center;background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:6px;padding:0 10px;height:32px;gap:6px}
#search-wrap svg{color:var(--muted);flex-shrink:0}
#search{background:none;border:none;outline:none;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text);width:100%}
#search::placeholder{color:var(--muted)}
#clear-btn{cursor:pointer;color:var(--muted);font-size:14px;background:none;border:none;padding:0;display:none}
#clear-btn:hover{color:var(--text)}
#search-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#0d1520;border:1px solid var(--bdr);border-radius:8px;z-index:2000;max-height:290px;overflow-y:auto;box-shadow:0 6px 24px rgba(0,0,0,.85);display:none}
#search-dropdown::-webkit-scrollbar{width:4px}
#search-dropdown::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.sd-section{padding:4px 0}
.sd-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.2em;color:var(--muted);padding:6px 12px 3px;text-transform:uppercase}
.sd-item{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;cursor:pointer;transition:background .12s}
.sd-item:hover{background:rgba(0,212,255,.08)}
.sd-name{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.sd-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);flex-shrink:0;margin-left:8px}
.sd-div{border-top:1px solid var(--bdr);margin:3px 0}
.sd-place-btn{display:flex;align-items:center;gap:7px;padding:8px 12px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;color:var(--muted);transition:all .12s}
.sd-place-btn:hover{color:var(--cyan);background:rgba(0,212,255,.06)}
.sd-no-results{padding:10px 12px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted)}
#globe{position:fixed;top:52px;left:0;right:0;bottom:0}
#panel{position:fixed;top:62px;left:12px;width:252px;background:var(--panel);border:1px solid var(--bdr);border-radius:10px;padding:14px;z-index:900;backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto}
#panel::-webkit-scrollbar{width:4px}
#panel::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.panel-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:7px}
.tier-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.tier-label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text)}
.tier-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tier-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
#precision-section{transition:opacity .4s}
#zoom-hint{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.1em;color:var(--amber);display:none;margin-left:4px}
select{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:6px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 8px;outline:none;cursor:pointer}
select option{background:#0b0f1a}
.panel-divider{border:none;border-top:1px solid var(--bdr)}
.panel-btn{background:none;border:1px solid var(--bdr);border-radius:6px;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;padding:5px 10px;cursor:pointer;width:100%;text-transform:uppercase;transition:all .2s}
.panel-btn:hover{color:var(--cyan);border-color:var(--cyan)}
#result-info{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--amber);display:none}
#spec-toggle{background:none;border:none;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:5px;padding:0}
#spec-toggle:hover{color:var(--cyan)}
#spec-toggle .arrow{transition:transform .2s}
#spec-toggle.open .arrow{transform:rotate(90deg)}
#spec-panel{display:none}
#spec-panel.open{display:block}
.spec-filter{margin-bottom:10px}
.spec-filter-label{font-size:11px;color:var(--text);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.spec-filter-label .unit{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted)}
.cov-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;border-radius:3px;padding:1px 5px;margin-left:auto;flex-shrink:0}
.cov-badge.low{background:rgba(248,113,113,.12);color:var(--red)}
.cov-badge.med{background:rgba(251,191,36,.12);color:var(--amber)}
.cov-badge.hi{background:rgba(0,255,136,.12);color:var(--green)}
.spec-note{font-size:10px;color:var(--muted);line-height:1.5;margin-bottom:10px;padding:7px 9px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.15);border-radius:6px}
.range-row{display:flex;align-items:center;gap:5px}
.ri{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:5px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:10px;padding:4px 6px;outline:none;width:0;min-width:0}
.ri:focus{border-color:var(--cyan)}
.ri::placeholder{color:var(--muted)}
.rsep{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);flex-shrink:0}
.req-row{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:10px;color:var(--muted);cursor:pointer}
.req-row input{accent-color:var(--cyan);cursor:pointer}
#popup{position:fixed;z-index:850;display:none;min-width:300px;max-width:360px;background:#0d1520;border:1px solid var(--bdr);border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.85);max-height:calc(100vh - 80px);overflow-y:auto}
#popup::-webkit-scrollbar{width:4px}
#popup::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.p-close{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;z-index:1;padding:2px 6px;border-radius:4px}
.p-close:hover{color:var(--text);background:rgba(255,255,255,.06)}
.p-images{display:grid;gap:1px;border-radius:10px 10px 0 0;overflow:hidden;height:130px}
.p-images.two{grid-template-columns:1fr 1fr}
.p-images.one{grid-template-columns:1fr}
.p-img-wrap{position:relative;overflow:hidden;background:#060b18}
.p-img-wrap img{width:100%;height:100%;object-fit:cover;transition:opacity .3s;opacity:0}
.p-img-wrap img.loaded{opacity:1}
.p-img-lbl{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.75));font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.1em;color:rgba(255,255,255,.7);padding:14px 7px 5px;text-transform:uppercase}
.p-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.1em;text-decoration:none;transition:color .2s}
.p-placeholder:hover{color:var(--cyan)}
.p-placeholder svg{opacity:.3}
.p-promo{padding:6px 14px;background:rgba(0,212,255,.04);border-bottom:1px solid var(--bdr);font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.05em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.p-sv-cmp{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#34d399;text-decoration:none;white-space:nowrap;border:1px solid rgba(52,211,153,.25);border-radius:4px;padding:2px 7px;transition:all .2s;flex-shrink:0}
.p-sv-cmp:hover{background:rgba(52,211,153,.1);border-color:#34d399}
.p-head{padding:11px 36px 8px 14px;border-bottom:1px solid var(--bdr)}
.p-name{font-size:13px;font-weight:500;color:#fff;line-height:1.4;margin-bottom:3px}
.p-country{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.08em}
.p-body{padding:9px 14px 13px}
.p-row{display:flex;gap:8px;font-size:11px;margin-bottom:5px;line-height:1.5}
.p-rl{font-family:'IBM Plex Mono',monospace;color:var(--muted);flex-shrink:0;padding-top:1px}
.p-rv{color:var(--text);word-break:break-word}
.p-divider{border:none;border-top:1px solid var(--bdr);margin:7px 0}
.p-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.p-chip{font-family:'IBM Plex Mono',monospace;font-size:10px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);border-radius:4px;padding:2px 6px;color:var(--cyan)}
.p-desc{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:9px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.p-actions{display:flex;gap:8px;flex-wrap:wrap}
.p-link{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:10px;text-decoration:none;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:4px 9px;transition:all .2s;color:var(--cyan);border:1px solid rgba(0,212,255,.25);background:rgba(0,212,255,.06)}
.p-link:hover{background:rgba(0,212,255,.14);border-color:var(--cyan)}
.tier-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;border-radius:3px;padding:1px 5px;text-transform:uppercase;margin-left:6px;vertical-align:middle}
.tier-badge.address{background:rgba(0,255,136,.12);color:var(--green)}
.tier-badge.city{background:rgba(251,191,36,.12);color:var(--amber)}
.tier-badge.country{background:rgba(248,113,113,.12);color:var(--red)}
#tooltip{position:fixed;z-index:900;display:none;pointer-events:none;background:rgba(11,15,26,.95);border:1px solid var(--bdr);border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text);padding:5px 9px;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(8px)}
.maplibregl-ctrl-attrib{background:rgba(11,15,26,.75)!important;color:var(--muted)!important;font-size:9px!important}
.maplibregl-ctrl-attrib a{color:var(--muted)!important}
.maplibregl-ctrl-group{background:var(--panel)!important;border:1px solid var(--bdr)!important;border-radius:8px!important;overflow:hidden}
.maplibregl-ctrl-group button{background:var(--panel)!important;border-bottom:1px solid var(--bdr)!important}
.maplibregl-ctrl-group button:hover{background:rgba(0,212,255,.08)!important}
.maplibregl-ctrl-icon{filter:invert(.6)}
</style>
</head>
<body>
<header id="header">
  <div id="header-title"><div class="pulse-dot"></div>Global Data Center Atlas</div>
  <div id="search-container">
    <div id="search-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" type="text" placeholder="Country, state, city, or data center…" autocomplete="off" spellcheck="false"/>
      <button id="clear-btn">✕</button>
    </div>
    <div id="search-dropdown"></div>
  </div>
  <div id="header-count">Loading…</div>
</header>

<div id="panel">
  <div id="precision-section">
    <div class="panel-lbl">Precision <span id="zoom-hint">— zoom in to see</span></div>
    <div class="tier-row"><div class="tier-label"><div class="tier-dot" style="background:var(--green);box-shadow:0 0 6px var(--green)"></div>Street address</div><div class="tier-count" id="cnt-address">—</div></div>
    <div class="tier-row"><div class="tier-label"><div class="tier-dot" style="background:var(--amber);box-shadow:0 0 6px var(--amber)"></div>City / town</div><div class="tier-count" id="cnt-city">—</div></div>
    <div class="tier-row"><div class="tier-label"><div class="tier-dot" style="background:var(--red);box-shadow:0 0 6px var(--red)"></div>Country centre</div><div class="tier-count" id="cnt-country">—</div></div>
  </div>
  <hr class="panel-divider"/>
  <div>
    <div class="panel-lbl">Country</div>
    <select id="country-select"><option value="">All countries</option></select>
  </div>
  <hr class="panel-divider"/>
  <div>
    <button id="spec-toggle"><span class="arrow">▶</span> Filter by specs</button>
    <div id="spec-panel">
      <br/>
      <div class="spec-note">⚠ Not all data centers report every stat.</div>
      <div class="spec-filter">
        <div class="spec-filter-label">Total Space <span class="unit">sqft</span><span class="cov-badge" id="cov-space">—</span></div>
        <div class="range-row"><input class="ri" id="space-min" type="number" min="0" placeholder="Min"/><span class="rsep">–</span><input class="ri" id="space-max" type="number" min="0" placeholder="Max"/></div>
        <label class="req-row"><input type="checkbox" id="space-req"/> Only with size data</label>
      </div>
      <div class="spec-filter">
        <div class="spec-filter-label">Colo Space <span class="unit">sqft</span><span class="cov-badge" id="cov-colo">—</span></div>
        <div class="range-row"><input class="ri" id="colo-min" type="number" min="0" placeholder="Min"/><span class="rsep">–</span><input class="ri" id="colo-max" type="number" min="0" placeholder="Max"/></div>
        <label class="req-row"><input type="checkbox" id="colo-req"/> Only with colo data</label>
      </div>
      <div class="spec-filter">
        <div class="spec-filter-label">Total Power <span class="unit">MW</span><span class="cov-badge" id="cov-power">—</span></div>
        <div class="range-row"><input class="ri" id="power-min" type="number" min="0" step="0.1" placeholder="Min"/><span class="rsep">–</span><input class="ri" id="power-max" type="number" min="0" step="0.1" placeholder="Max"/></div>
        <label class="req-row"><input type="checkbox" id="power-req"/> Only with power data</label>
      </div>
    </div>
  </div>
  <hr class="panel-divider"/>
  <button class="panel-btn" id="reset-btn">Reset all filters</button>
  <div id="result-info"></div>
</div>

<div id="globe"></div>
<div id="popup"></div>
<div id="tooltip"></div>

<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script>
window.addEventListener('load', function () {
  const CZ = 9; // CLUSTER_ZOOM — dots become precision-coded at this zoom level

  // ── Map (NO projection in constructor — set explicitly after style loads) ────
  const map = new maplibregl.Map({
    container: 'globe',
    style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    center: [10, 20],
    zoom: 1.8,
    maxZoom: 20,
    antialias: true,
    attributionControl: false,
  });
  map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

  // ── Auto-rotation — declared but NOT started until style.load fires ──────────
  let rotating = false, rotateTimer, lastTs = null;
  function spin(ts) {
    if (rotating && lastTs !== null && !map.isMoving()) {
      const dt = (ts - lastTs) / 1000;
      const c  = map.getCenter();
      map.jumpTo({ center: [c.lng - 3 * dt, c.lat] });
    }
    lastTs = rotating ? ts : null;
    requestAnimationFrame(spin);
  }
  // Interaction handlers — always active so they don't interfere with anything
  function stopSpin()  { rotating = false; clearTimeout(rotateTimer); lastTs = null; }
  function resumeSpin(){ rotateTimer = setTimeout(() => { rotating = true; }, 4000); }
  map.on('mousedown', stopSpin);  map.on('touchstart', stopSpin);
  map.on('mouseup',   resumeSpin); map.on('touchend',  resumeSpin);
  map.on('wheel', stopSpin); map.on('zoomstart', stopSpin); map.on('zoomend', resumeSpin);

  // ── Helpers ───────────────────────────────────────────────────────────────────
  function parseSqft(v){if(!v)return null;const m=String(v).replace(/,/g,'').match(/(\d+(?:\.\d+)?)/);return m?+m[1]:null}
  function parseMW(v)  {if(!v)return null;const m=String(v).replace(/,/g,'').match(/(\d+(?:\.\d+)?)/);return m?+m[1]:null}
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

  // ── Popup ─────────────────────────────────────────────────────────────────────
  const popupEl   = document.getElementById('popup');
  const tooltipEl = document.getElementById('tooltip');

  function buildPopup(d) {
    const SL={'total space':'Total Space','colocation space':'Colo Space','total power':'Total Power','to nearest airport':'Nearest Airport'};
    const chips=Object.entries(SL).filter(([k])=>d[k]).map(([k,l])=>`<div class="p-chip">${esc(d[k])} <span style="opacity:.6">${l}</span></div>`).join('');
    const badge=`<span class="tier-badge ${d.tier||'country'}">${{address:'Exact',city:'City',country:'Country'}[d.tier]||'Country'}</span>`;
    const addr=d.address?`<div class="p-row"><div class="p-rl">ADDR</div><div class="p-rv">${esc(d.address)}</div></div>`:'';
    const desc=d.description?`<hr class="p-divider"><div class="p-desc">${esc(d.description)}</div>`:'';
    const exact=d.tier==='address';
    const svUrl=exact?`https://www.google.com/maps?q=${d.lat},${d.lng}&layer=c&cbll=${d.lat},${d.lng}`:null;

    let top='';
    if(d.image_url){
      if(exact){
        top=`<div class="p-images two">
          <div class="p-img-wrap">
            <img src="${esc(d.image_url)}" alt="" onload="this.classList.add('loaded')" onerror="this.parentElement.innerHTML='<span class=p-placeholder>No image</span>'"/>
            <div class="p-img-lbl">Official</div>
          </div>
          <a class="p-img-wrap p-placeholder" href="${esc(svUrl)}" target="_blank" rel="noopener">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>
            Compare →<div class="p-img-lbl">Street View</div>
          </a></div>
        <div class="p-promo">📸 Promotional image — datacenters.com
          <a class="p-sv-cmp" href="${esc(svUrl)}" target="_blank" rel="noopener">Compare with Street View →</a>
        </div>`;
      } else {
        top=`<div class="p-images one">
          <div class="p-img-wrap">
            <img src="${esc(d.image_url)}" alt="" onload="this.classList.add('loaded')" onerror="this.parentElement.innerHTML='<span class=p-placeholder>No image</span>'"/>
            <div class="p-img-lbl">Official</div>
          </div></div>
        <div class="p-promo">📸 Promotional image provided by datacenters.com</div>`;
      }
    }
    const dcLink=d.page_url?`<a class="p-link" href="${esc(d.page_url)}" target="_blank" rel="noopener">datacenters.com <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>`:'';
    return `${top}
      <button class="p-close" onclick="document.getElementById('popup').style.display='none'">×</button>
      <div class="p-head"><div class="p-name">${esc(d.name)}${badge}</div><div class="p-country">${esc(d.country)}</div></div>
      <div class="p-body">${addr}${chips?`<div class="p-chips">${chips}</div>`:''}${desc}<div class="p-actions">${dcLink}</div></div>`;
  }

  function showPopup(d, cx, cy) {
    popupEl.innerHTML = buildPopup(d);
    popupEl.style.display = 'block';
    requestAnimationFrame(() => {
      const pw=popupEl.offsetWidth||340, ph=popupEl.offsetHeight||420;
      let x=cx+18, y=cy-24;
      if(x+pw>window.innerWidth-8)  x=cx-pw-18;
      if(y+ph>window.innerHeight-8) y=window.innerHeight-ph-8;
      if(y<60)y=60; if(x<8)x=8;
      popupEl.style.left=x+'px'; popupEl.style.top=y+'px';
    });
  }

  // ── Data & search index ───────────────────────────────────────────────────────
  let allPoints = [], countries = new Set(), countryCounts = {};

  // ── Zoom-based legend opacity ─────────────────────────────────────────────────
  function updateLegend(zoom) {
    const s=document.getElementById('precision-section');
    const h=document.getElementById('zoom-hint');
    s.style.opacity = zoom >= CZ ? '1' : '0.4';
    h.style.display = zoom >= CZ ? 'none' : 'inline';
  }
  map.on('zoom', () => updateLegend(map.getZoom()));

  // ── style.load — set up globe, sources, layers, then load data ────────────────
  map.on('style.load', () => {

    // KEY FIX: force globe projection AFTER the style has loaded
    // (the CARTO style specifies mercator; this overrides it)
    map.setProjection({ type: 'globe' });

    // Now that the map is ready, start auto-rotation
    rotating = true;
    requestAnimationFrame(spin);

    // Atmosphere
    try {
      map.setFog({
        color: '#0b0f1a',
        'high-color': '#142230',
        'space-color': '#0b0f1a',
        'horizon-blend': 0.03,
        'star-intensity': 0.08,
      });
    } catch(e) { /* setFog not critical */ }

    // GeoJSON source with MapLibre clustering
    map.addSource('datacenters', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] },
      cluster: true,
      clusterMaxZoom: CZ - 1,
      clusterRadius: 48,
    });

    // ── Cluster glow (outer halo) ─────────────────────────────────────────────
    map.addLayer({
      id: 'cluster-glow', type: 'circle', source: 'datacenters',
      filter: ['has', 'point_count'],
      paint: {
        'circle-color': '#ff9a32',
        'circle-opacity': ['interpolate',['linear'],['get','point_count'], 1,0.12, 50,0.17, 500,0.22],
        'circle-radius':  ['interpolate',['linear'],['get','point_count'], 1,18, 10,32, 100,52, 1000,80],
        'circle-blur': 0.95,
      }
    });
    // ── Cluster core ──────────────────────────────────────────────────────────
    map.addLayer({
      id: 'cluster-core', type: 'circle', source: 'datacenters',
      filter: ['has', 'point_count'],
      paint: {
        'circle-color': '#ffb946',
        'circle-opacity': ['interpolate',['linear'],['get','point_count'], 1,0.78, 500,0.9],
        'circle-radius':  ['interpolate',['linear'],['get','point_count'], 1,9, 10,15, 100,24, 1000,38],
        'circle-stroke-color': '#ffcf78',
        'circle-stroke-width': 1.5,
        'circle-stroke-opacity': 0.5,
      }
    });
    // ── Cluster count label ───────────────────────────────────────────────────
    map.addLayer({
      id: 'cluster-count', type: 'symbol', source: 'datacenters',
      filter: ['has', 'point_count'],
      layout: {
        'text-field': ['get', 'point_count_abbreviated'],
        'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
        'text-size': ['interpolate',['linear'],['zoom'], 1,10, 6,13],
        'text-allow-overlap': false,
      },
      paint: { 'text-color': '#fff', 'text-halo-color': 'rgba(0,0,0,0.6)', 'text-halo-width': 1.5 }
    });

    // ── Far-view individual dots (warm amber, below CZ) ───────────────────────
    map.addLayer({
      id: 'dc-far', type: 'circle', source: 'datacenters',
      filter: ['!', ['has', 'point_count']],
      maxzoom: CZ,
      paint: {
        'circle-radius': ['interpolate',['linear'],['zoom'], 2,2.5, 6,3.5, 8,4.5],
        'circle-color': '#ffc864',
        'circle-opacity': 0.82,
        'circle-stroke-color': '#ffd890',
        'circle-stroke-width': 0.5,
        'circle-stroke-opacity': 0.3,
        'circle-blur': 0.2,
      }
    });

    // ── Close-view individual dots (precision colour, CZ and above) ───────────
    map.addLayer({
      id: 'dc-close', type: 'circle', source: 'datacenters',
      filter: ['!', ['has', 'point_count']],
      minzoom: CZ,
      paint: {
        'circle-radius': ['interpolate',['linear'],['zoom'], 9,4, 12,6.5, 16,9],
        'circle-color': ['match',['get','tier'], 'address','#00ff88', 'city','#fbbf24', '#f87171'],
        'circle-opacity': 0.88,
        'circle-stroke-color': 'rgba(255,255,255,0.22)',
        'circle-stroke-width': 0.8,
      }
    });

    // ── Cluster click → zoom to expand ───────────────────────────────────────
    map.on('click', 'cluster-core', e => {
      const f = map.queryRenderedFeatures(e.point, { layers: ['cluster-core'] });
      if (!f.length) return;
      stopSpin();
      map.getSource('datacenters').getClusterExpansionZoom(f[0].properties.cluster_id, (err, zoom) => {
        if (err) return;
        map.easeTo({ center: f[0].geometry.coordinates, zoom: zoom + 0.5, duration: 600 });
      });
    });

    // ── Individual dot click/hover (both layers) ──────────────────────────────
    ['dc-close', 'dc-far'].forEach(layer => {
      map.on('click', layer, e => {
        if (!e.features.length) return;
        stopSpin();
        showPopup(e.features[0].properties, e.point.x, e.point.y);
      });
      map.on('mouseenter', layer, e => {
        map.getCanvas().style.cursor = 'pointer';
        if (e.features.length) { tooltipEl.textContent = e.features[0].properties.name; tooltipEl.style.display = 'block'; }
      });
      map.on('mousemove', layer, e => {
        tooltipEl.style.left = (e.point.x+14)+'px';
        tooltipEl.style.top  = (e.point.y-32)+'px';
        if (e.features.length) tooltipEl.textContent = e.features[0].properties.name;
      });
      map.on('mouseleave', layer, () => { map.getCanvas().style.cursor = ''; tooltipEl.style.display = 'none'; });
    });
    map.on('mouseenter', 'cluster-core', () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'cluster-core', () => { map.getCanvas().style.cursor = ''; });

    // Close popup when clicking empty space
    map.on('click', e => {
      const f = map.queryRenderedFeatures(e.point, { layers: ['dc-close','dc-far','cluster-core'] });
      if (!f.length) popupEl.style.display = 'none';
    });

    // ── Load GeoJSON data ─────────────────────────────────────────────────────
    fetch('datacenters.geojson')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(geojson => {
        const feats = geojson.features || [];
        const tiers = { address:0, city:0, country:0 };

        allPoints = feats.map(f => {
          const p = f.properties;
          const t = p.tier || 'country';
          if (t in tiers) tiers[t]++;
          countries.add(p.country);
          countryCounts[p.country] = (countryCounts[p.country]||0) + 1;
          return { lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0], ...p,
            _space:parseSqft(p['total space']), _colo:parseSqft(p['colocation space']), _power:parseMW(p['total power']) };
        });

        pushToMap(allPoints);

        document.getElementById('header-count').innerHTML =
          `<span>${feats.length.toLocaleString()}</span> data centers · <span>${countries.size}</span> countries`;
        document.getElementById('cnt-address').textContent = tiers.address.toLocaleString();
        document.getElementById('cnt-city').textContent    = tiers.city.toLocaleString();
        document.getElementById('cnt-country').textContent = tiers.country.toLocaleString();
        updateLegend(map.getZoom());

        // Coverage badges
        const total = feats.length;
        [['cov-space','total space'],['cov-colo','colocation space'],['cov-power','total power']].forEach(([id,key]) => {
          const n   = allPoints.filter(d=>d[key]).length;
          const pct = Math.round(n/total*100);
          const el  = document.getElementById(id);
          el.textContent = pct+'% of DCs';
          el.className   = 'cov-badge ' + (pct>=60?'hi':pct>=30?'med':'low');
        });

        // Country dropdown — sorted most DCs → fewest, then A-Z
        const sel = document.getElementById('country-select');
        [...countries]
          .sort((a,b) => {
            const d = (countryCounts[b]||0) - (countryCounts[a]||0);
            return d !== 0 ? d : a.localeCompare(b);
          })
          .forEach(c => {
            const o = document.createElement('option');
            o.value = c;
            o.textContent = `${c} (${(countryCounts[c]||0).toLocaleString()})`;
            sel.appendChild(o);
          });
      })
      .catch(err => {
        document.getElementById('header-count').textContent = 'Could not load datacenters.geojson — see README';
        console.error('GeoJSON load error:', err);
      });
  }); // end style.load

  map.on('error', e => console.error('MapLibre error:', e.error));

  // ── Push points to source ─────────────────────────────────────────────────────
  function pushToMap(pts) {
    const src = map.getSource('datacenters');
    if (!src) return;
    src.setData({
      type: 'FeatureCollection',
      features: pts.map(d => ({
        type: 'Feature',
        geometry: { type:'Point', coordinates:[d.lng,d.lat] },
        properties: d,
      })),
    });
  }

  // ── Search ────────────────────────────────────────────────────────────────────
  const searchEl  = document.getElementById('search');
  const clearBtn  = document.getElementById('clear-btn');
  const dropdown  = document.getElementById('search-dropdown');
  let searchTimer;

  function closeDD() { dropdown.style.display = 'none'; }
  function openDD()  { dropdown.style.display = 'block'; }

  searchEl.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const q = searchEl.value.trim();
    clearBtn.style.display = q ? 'block' : 'none';
    if (!q) { closeDD(); applyFilters(); return; }
    searchTimer = setTimeout(() => buildDropdown(q), 180);
  });
  searchEl.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDD(); searchEl.blur(); } });
  document.addEventListener('click', e => {
    if (!document.getElementById('search-container').contains(e.target)) closeDD();
  });

  function buildDropdown(q) {
    const ql = q.toLowerCase();
    const parts = [];

    // Countries
    const cMatches = [...countries].filter(c => c.toLowerCase().includes(ql))
      .sort((a,b) => (countryCounts[b]||0) - (countryCounts[a]||0)).slice(0,6);
    if (cMatches.length) {
      parts.push('<div class="sd-section"><div class="sd-lbl">Countries</div>');
      cMatches.forEach(c => parts.push(
        `<div class="sd-item" data-type="country" data-value="${esc(c)}">
           <span class="sd-name">${esc(c)}</span>
           <span class="sd-meta">${(countryCounts[c]||0).toLocaleString()} DCs</span></div>`));
      parts.push('</div>');
    }

    // Data centers
    const dcMatches = allPoints.filter(d =>
      d.name.toLowerCase().includes(ql) || (d.address||'').toLowerCase().includes(ql)).slice(0,6);
    if (dcMatches.length) {
      if (parts.length) parts.push('<div class="sd-div"></div>');
      parts.push('<div class="sd-section"><div class="sd-lbl">Data Centers</div>');
      dcMatches.forEach(d => parts.push(
        `<div class="sd-item" data-type="dc" data-lat="${d.lat}" data-lng="${d.lng}" data-name="${esc(d.name)}" data-idx="${allPoints.indexOf(d)}">
           <span class="sd-name">${esc(d.name)}</span>
           <span class="sd-meta">${esc(d.country)}</span></div>`));
      parts.push('</div>');
    }

    if (!cMatches.length && !dcMatches.length)
      parts.push('<div class="sd-no-results">No matching countries or data centers</div>');

    parts.push(`<div class="sd-div"></div>
      <div class="sd-place-btn" id="sd-place">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        Search "<strong>${esc(q)}</strong>" as a place
      </div>`);

    dropdown.innerHTML = parts.join('');
    openDD();

    dropdown.querySelectorAll('.sd-item[data-type="country"]').forEach(el =>
      el.addEventListener('click', () => {
        closeDD(); searchEl.value = el.dataset.value; clearBtn.style.display = 'block';
        flyToCountry(el.dataset.value);
      }));

    dropdown.querySelectorAll('.sd-item[data-type="dc"]').forEach(el =>
      el.addEventListener('click', () => {
        closeDD();
        const idx = parseInt(el.dataset.idx);
        const d   = allPoints[idx];
        if (!d) return;
        stopSpin();
        map.flyTo({ center:[d.lng,d.lat], zoom:15, duration:1400 });
        setTimeout(() => showPopup(d, window.innerWidth/2, window.innerHeight/2+60), 900);
      }));

    const placeBtn = document.getElementById('sd-place');
    if (placeBtn) placeBtn.addEventListener('click', () => nominatimFly(q));
  }

  function flyToCountry(country) {
    document.getElementById('country-select').value = country;
    activeCountry = country;
    applyFilters();
    const pts = allPoints.filter(d => d.country === country);
    if (!pts.length) return;
    const lats = pts.map(d=>d.lat), lngs = pts.map(d=>d.lng);
    map.fitBounds([[Math.min(...lngs),Math.min(...lats)],[Math.max(...lngs),Math.max(...lats)]],
      { padding:80, maxZoom:6, duration:1200 });
  }

  function nominatimFly(q) {
    closeDD();
    fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`)
      .then(r => r.json())
      .then(res => {
        if (!res.length) { alert(`No place found for "${q}"`); return; }
        const bb = res[0].boundingbox.map(parseFloat);
        map.fitBounds([[bb[2],bb[0]],[bb[3],bb[1]]], { padding:60, maxZoom:14, duration:1400 });
      })
      .catch(() => alert('Place search failed.'));
  }

  // ── Filter ────────────────────────────────────────────────────────────────────
  let activeCountry = '', activeSearch = '';

  function getSpec() {
    const n = v => v===''?null:+v;
    return {
      space:{ min:n(document.getElementById('space-min').value), max:n(document.getElementById('space-max').value), req:document.getElementById('space-req').checked },
      colo: { min:n(document.getElementById('colo-min').value),  max:n(document.getElementById('colo-max').value),  req:document.getElementById('colo-req').checked  },
      power:{ min:n(document.getElementById('power-min').value), max:n(document.getElementById('power-max').value), req:document.getElementById('power-req').checked  },
    };
  }
  function ok(val, f) {
    if (f.req && val===null) return false;
    if (val===null) return true;
    if (f.min!==null && val<f.min) return false;
    if (f.max!==null && val>f.max) return false;
    return true;
  }

  function applyFilters() {
    const q = activeSearch.toLowerCase().trim();
    const s = getSpec();
    const m = allPoints.filter(d => {
      if (activeCountry && d.country!==activeCountry) return false;
      if (q && ![(d.name||''),(d.country||''),(d.address||'')].some(t=>t.toLowerCase().includes(q))) return false;
      return ok(d._space,s.space) && ok(d._colo,s.colo) && ok(d._power,s.power);
    });
    pushToMap(m);
    popupEl.style.display = 'none';
    const hasF = q||activeCountry||Object.values(s).some(f=>f.min!==null||f.max!==null||f.req);
    const info = document.getElementById('result-info');
    if (hasF) { info.style.display='block'; info.textContent=m.length.toLocaleString()+' results'; }
    else info.style.display='none';
  }

  // ── Wiring ────────────────────────────────────────────────────────────────────
  clearBtn.addEventListener('click', () => { searchEl.value=''; activeSearch=''; clearBtn.style.display='none'; closeDD(); applyFilters(); });
  document.getElementById('country-select').addEventListener('change', e => {
    const v = e.target.value;
    if (v) flyToCountry(v); else { activeCountry=''; applyFilters(); }
  });
  document.getElementById('spec-toggle').addEventListener('click', function(){
    this.classList.toggle('open'); document.getElementById('spec-panel').classList.toggle('open');
  });
  ['space-min','space-max','colo-min','colo-max','power-min','power-max'].forEach(id =>
    document.getElementById(id).addEventListener('input', applyFilters));
  ['space-req','colo-req','power-req'].forEach(id =>
    document.getElementById(id).addEventListener('change', applyFilters));
  document.getElementById('reset-btn').addEventListener('click', () => {
    searchEl.value=''; activeSearch=''; activeCountry=''; clearBtn.style.display='none'; closeDD();
    document.getElementById('country-select').value='';
    document.getElementById('result-info').style.display='none';
    ['space-min','space-max','colo-min','colo-max','power-min','power-max'].forEach(id=>document.getElementById(id).value='');
    ['space-req','colo-req','power-req'].forEach(id=>document.getElementById(id).checked=false);
    pushToMap(allPoints);
    popupEl.style.display='none';
    map.flyTo({ center:[10,20], zoom:1.8, duration:1200 });
  });

}); // end load
</script>
</body>
</html>
