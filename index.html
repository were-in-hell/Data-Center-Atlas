<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Global Data Center Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0b0f1a;--panel:rgba(11,15,26,0.92);--bdr:rgba(0,212,255,0.18);--cyan:#00d4ff;--green:#00ff88;--amber:#fbbf24;--red:#f87171;--text:#c8d6e5;--muted:#5a7085}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'IBM Plex Sans',sans-serif;color:var(--text);height:100vh;overflow:hidden}
#header{position:fixed;top:0;left:0;right:0;height:52px;background:var(--panel);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 20px;gap:16px;z-index:1000;backdrop-filter:blur(12px)}
#header-title{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;letter-spacing:.18em;color:var(--cyan);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.pulse-dot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 8px var(--green);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 8px var(--green)}50%{opacity:.4;box-shadow:0 0 2px var(--green)}}
#header-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-left:auto}
#header-count span{color:var(--cyan)}
#search-container{position:relative;flex:0 0 300px}
#search-wrap{display:flex;align-items:center;background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:6px;padding:0 10px;height:32px;gap:6px}
#search-wrap svg{color:var(--muted);flex-shrink:0}
#search{background:none;border:none;outline:none;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text);width:100%}
#search::placeholder{color:var(--muted)}
#clear-btn{cursor:pointer;color:var(--muted);font-size:14px;background:none;border:none;padding:0;display:none}
#clear-btn:hover{color:var(--text)}
#search-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#0d1520;border:1px solid var(--bdr);border-radius:8px;z-index:2000;max-height:290px;overflow-y:auto;box-shadow:0 6px 24px rgba(0,0,0,.85);display:none}
#search-dropdown::-webkit-scrollbar{width:4px}
#search-dropdown::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.sd-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.2em;color:var(--muted);padding:6px 12px 3px;text-transform:uppercase}
.sd-item{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;cursor:pointer;transition:background .12s}
.sd-item:hover{background:rgba(0,212,255,.08)}
.sd-name{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.sd-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);flex-shrink:0;margin-left:8px}
.sd-div{border-top:1px solid var(--bdr);margin:3px 0}
.sd-place{display:flex;align-items:center;gap:7px;padding:8px 12px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;color:var(--muted);transition:all .12s}
.sd-place:hover{color:var(--cyan);background:rgba(0,212,255,.06)}
.sd-none{padding:10px 12px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted)}
#globe{position:fixed;top:52px;left:0;right:0;bottom:0}
#panel{position:fixed;top:62px;left:12px;width:252px;background:var(--panel);border:1px solid var(--bdr);border-radius:10px;padding:14px;z-index:900;backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto}
#panel::-webkit-scrollbar{width:4px}
#panel::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.plbl{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:7px}
.tier-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.tier-label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text)}
.tier-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tier-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
#precision-section{transition:opacity .4s}
#zoom-hint{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.1em;color:var(--amber);display:none;margin-left:4px}
select{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:6px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 8px;outline:none;cursor:pointer}
select option{background:#0b0f1a}
.pdiv{border:none;border-top:1px solid var(--bdr)}
.pbtn{background:none;border:1px solid var(--bdr);border-radius:6px;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;padding:5px 10px;cursor:pointer;width:100%;text-transform:uppercase;transition:all .2s}
.pbtn:hover{color:var(--cyan);border-color:var(--cyan)}
#result-info{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--amber);display:none}
#spec-toggle{background:none;border:none;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:5px;padding:0}
#spec-toggle:hover{color:var(--cyan)}
#spec-toggle .arrow{transition:transform .2s}
#spec-toggle.open .arrow{transform:rotate(90deg)}
#spec-panel{display:none}
#spec-panel.open{display:block}
.sf{margin-bottom:10px}
.sf-lbl{font-size:11px;color:var(--text);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.sf-lbl .u{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted)}
.cb{font-family:'IBM Plex Mono',monospace;font-size:9px;border-radius:3px;padding:1px 5px;margin-left:auto;flex-shrink:0}
.cb.lo{background:rgba(248,113,113,.12);color:var(--red)}
.cb.me{background:rgba(251,191,36,.12);color:var(--amber)}
.cb.hi{background:rgba(0,255,136,.12);color:var(--green)}
.snote{font-size:10px;color:var(--muted);line-height:1.5;margin-bottom:10px;padding:7px 9px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.15);border-radius:6px}
.rr{display:flex;align-items:center;gap:5px}
.ri{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:5px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:10px;padding:4px 6px;outline:none;width:0;min-width:0}
.ri:focus{border-color:var(--cyan)}
.ri::placeholder{color:var(--muted)}
.rs{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);flex-shrink:0}
.req{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:10px;color:var(--muted);cursor:pointer}
.req input{accent-color:var(--cyan);cursor:pointer}
#popup{position:fixed;z-index:850;display:none;min-width:300px;max-width:360px;background:#0d1520;border:1px solid var(--bdr);border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.85);max-height:calc(100vh - 80px);overflow-y:auto}
#popup::-webkit-scrollbar{width:4px}
#popup::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.px{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;z-index:1;padding:2px 6px;border-radius:4px}
.px:hover{color:var(--text);background:rgba(255,255,255,.06)}
.pi{display:grid;gap:1px;border-radius:10px 10px 0 0;overflow:hidden;height:130px}
.pi.two{grid-template-columns:1fr 1fr}
.pi.one{grid-template-columns:1fr}
.piw{position:relative;overflow:hidden;background:#060b18}
.piw img{width:100%;height:100%;object-fit:cover;transition:opacity .3s;opacity:0}
.piw img.loaded{opacity:1}
.pil{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.75));font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.1em;color:rgba(255,255,255,.7);padding:14px 7px 5px;text-transform:uppercase}
.pph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.1em;text-decoration:none;transition:color .2s}
.pph:hover{color:var(--cyan)}
.pph svg{opacity:.3}
.ppn{padding:6px 14px;background:rgba(0,212,255,.04);border-bottom:1px solid var(--bdr);font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.psv{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#34d399;text-decoration:none;white-space:nowrap;border:1px solid rgba(52,211,153,.25);border-radius:4px;padding:2px 7px;transition:all .2s;flex-shrink:0}
.psv:hover{background:rgba(52,211,153,.1);border-color:#34d399}
.ph{padding:11px 36px 8px 14px;border-bottom:1px solid var(--bdr)}
.pn{font-size:13px;font-weight:500;color:#fff;line-height:1.4;margin-bottom:3px}
.pc{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.08em}
.pb{padding:9px 14px 13px}
.pr{display:flex;gap:8px;font-size:11px;margin-bottom:5px;line-height:1.5}
.prl{font-family:'IBM Plex Mono',monospace;color:var(--muted);flex-shrink:0;padding-top:1px}
.prv{color:var(--text);word-break:break-word}
.pdivider{border:none;border-top:1px solid var(--bdr);margin:7px 0}
.pchips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.pchip{font-family:'IBM Plex Mono',monospace;font-size:10px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);border-radius:4px;padding:2px 6px;color:var(--cyan)}
.pdesc{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:9px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pacts{display:flex;gap:8px;flex-wrap:wrap}
.plink{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:10px;text-decoration:none;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:4px 9px;transition:all .2s;color:var(--cyan);border:1px solid rgba(0,212,255,.25);background:rgba(0,212,255,.06)}
.plink:hover{background:rgba(0,212,255,.14);border-color:var(--cyan)}
.tbadge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;border-radius:3px;padding:1px 5px;text-transform:uppercase;margin-left:6px;vertical-align:middle}
.tbadge.address{background:rgba(0,255,136,.12);color:var(--green)}
.tbadge.city{background:rgba(251,191,36,.12);color:var(--amber)}
.tbadge.country{background:rgba(248,113,113,.12);color:var(--red)}
#tooltip{position:fixed;z-index:900;display:none;pointer-events:none;background:rgba(11,15,26,.95);border:1px solid var(--bdr);border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text);padding:5px 9px;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(8px)}
</style>
</head>
<body>
<header id="header">
  <div id="header-title"><div class="pulse-dot"></div>Global Data Center Atlas</div>
  <div id="search-container">
    <div id="search-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" type="text" placeholder="Country, city, state, or data center…" autocomplete="off" spellcheck="false"/>
      <button id="clear-btn">&#x2715;</button>
    </div>
    <div id="search-dropdown"></div>
  </div>
  <div id="header-count">Loading&#8230;</div>
</header>
<div id="panel">
  <div id="precision-section">
    <div class="plbl">Precision <span id="zoom-hint">&#8212; zoom in to see</span></div>
    <div class="tier-row"><div class="tier-label"><div class="tier-dot" style="background:var(--green);box-shadow:0 0 6px var(--green)"></div>Street address</div><div class="tier-count" id="cnt-address">&#8212;</div></div>
    <div class="tier-row"><div class="tier-label"><div class="tier-dot" style="background:var(--amber);box-shadow:0 0 6px var(--amber)"></div>City / town</div><div class="tier-count" id="cnt-city">&#8212;</div></div>
    <div class="tier-row"><div class="tier-label"><div class="tier-dot" style="background:var(--red);box-shadow:0 0 6px var(--red)"></div>Country centre</div><div class="tier-count" id="cnt-country">&#8212;</div></div>
  </div>
  <hr class="pdiv"/>
  <div><div class="plbl">Country</div><select id="country-select"><option value="">All countries</option></select></div>
  <hr class="pdiv"/>
  <div>
    <button id="spec-toggle"><span class="arrow">&#9658;</span> Filter by specs</button>
    <div id="spec-panel"><br/>
      <div class="snote">&#9888; Not all data centers report every stat. The coverage percentage tells you how many DCs we have data for.</div>
      <div class="sf"><div class="sf-lbl">Total Space <span class="u">sqft</span><span class="cb" id="cov-space">&#8212;</span></div><div class="rr"><input class="ri" id="space-min" type="number" min="0" placeholder="Min"/><span class="rs">&#8211;</span><input class="ri" id="space-max" type="number" min="0" placeholder="Max"/></div><label class="req"><input type="checkbox" id="space-req"/> Only with size data</label></div>
      <div class="sf"><div class="sf-lbl">Colo Space <span class="u">sqft</span><span class="cb" id="cov-colo">&#8212;</span></div><div class="rr"><input class="ri" id="colo-min" type="number" min="0" placeholder="Min"/><span class="rs">&#8211;</span><input class="ri" id="colo-max" type="number" min="0" placeholder="Max"/></div><label class="req"><input type="checkbox" id="colo-req"/> Only with colo data</label></div>
      <div class="sf"><div class="sf-lbl">Total Power <span class="u">MW</span><span class="cb" id="cov-power">&#8212;</span></div><div class="rr"><input class="ri" id="power-min" type="number" min="0" step="0.1" placeholder="Min"/><span class="rs">&#8211;</span><input class="ri" id="power-max" type="number" min="0" step="0.1" placeholder="Max"/></div><label class="req"><input type="checkbox" id="power-req"/> Only with power data</label></div>
    </div>
  </div>
  <hr class="pdiv"/>
  <button class="pbtn" id="reset-btn">Reset all filters</button>
  <div id="result-info"></div>
</div>
<div id="globe"></div>
<div id="popup"></div>
<div id="tooltip"></div>

<script src="https://unpkg.com/globe.gl"></script>
<script>
window.addEventListener('load', function () {

  const CLUSTER_ALT = 0.8; // above this → cluster view; below → individual dots
  const CZ          = 0.8; // same threshold: precision legend shows when < CZ

  // ── Performance: no textures — build both surfaces from tiny canvases ──────
  function solidCanvas(color) {
    const c = Object.assign(document.createElement('canvas'), {width:2,height:2});
    c.getContext('2d').fillStyle = color;
    c.getContext('2d').fillRect(0,0,2,2);
    return c.toDataURL();
  }
  function starfield() {
    const c = Object.assign(document.createElement('canvas'), {width:1024,height:512});
    const ctx = c.getContext('2d');
    ctx.fillStyle='#05080f'; ctx.fillRect(0,0,1024,512);
    for (let i=0;i<700;i++) {
      ctx.globalAlpha = Math.random()*.75+.25;
      ctx.fillStyle   = '#ffffff';
      ctx.beginPath();
      ctx.arc(Math.random()*1024, Math.random()*512, Math.random()*.9+.1, 0, Math.PI*2);
      ctx.fill();
    }
    return c.toDataURL();
  }

  // ── Globe ─────────────────────────────────────────────────────────────────
  const world = Globe({ rendererConfig:{antialias:true,alpha:false}, animateIn:false })
    .globeImageUrl(solidCanvas('#0d1e35'))   // solid dark navy — no satellite
    .backgroundImageUrl(starfield())         // canvas stars — no real photo
    .showAtmosphere(true)
    .atmosphereColor('#1e7abf')
    .atmosphereAltitude(0.18)
    .pointAltitude(0.008)
    .pointRadius(0.22)
    .pointColor(d => ({address:'#00ff88',city:'#fbbf24',country:'#f87171'}[d.tier]||'#f87171'))
    .pointLabel('')
    .onPointClick(onPointClick)
    .onPointHover(onPointHover)
    (document.getElementById('globe'));

  world.controls().enableDamping   = true;
  world.controls().dampingFactor   = 0.08;
  world.controls().autoRotate      = true;
  world.controls().autoRotateSpeed = 0.35;
  world.controls().minDistance     = 120;
  world.controls().maxDistance     = 800;
  world.pointOfView({lat:20,lng:10,altitude:2.2}, 0);

  // ── Rotate pause/resume ───────────────────────────────────────────────────
  let rotTimer;
  const pauseRotate  = () => { world.controls().autoRotate=false; clearTimeout(rotTimer); };
  const resumeRotate = () => { rotTimer=setTimeout(()=>{world.controls().autoRotate=true;},4000); };
  const globeEl = document.getElementById('globe');
  globeEl.addEventListener('pointerdown', pauseRotate);
  globeEl.addEventListener('pointerup',   resumeRotate);
  globeEl.addEventListener('wheel',       pauseRotate);

  // ── Helpers ───────────────────────────────────────────────────────────────
  function parseSqft(v){if(!v)return null;const m=String(v).replace(/,/g,'').match(/(\d+(?:\.\d+)?)/);return m?+m[1]:null}
  function parseMW(v)  {if(!v)return null;const m=String(v).replace(/,/g,'').match(/(\d+(?:\.\d+)?)/);return m?+m[1]:null}
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function fmtCount(n){return n>=1000?Math.round(n/100)/10+'k':String(n);}

  // ── Popup ─────────────────────────────────────────────────────────────────
  const popupEl=document.getElementById('popup'), ttEl=document.getElementById('tooltip');

  function buildPopup(d){
    const SL={'total space':'Total Space','colocation space':'Colo Space','total power':'Total Power','to nearest airport':'Nearest Airport'};
    const chips=Object.entries(SL).filter(([k])=>d[k]).map(([k,l])=>`<div class="pchip">${esc(d[k])} <span style="opacity:.6">${l}</span></div>`).join('');
    const badge=`<span class="tbadge ${d.tier||'country'}">${{address:'Exact',city:'City',country:'Country'}[d.tier]||'Country'}</span>`;
    const addr=d.address?`<div class="pr"><div class="prl">ADDR</div><div class="prv">${esc(d.address)}</div></div>`:'';
    const desc=d.description?`<hr class="pdivider"><div class="pdesc">${esc(d.description)}</div>`:'';
    const exact=d.tier==='address';
    const svUrl=exact?`https://www.google.com/maps?q=${d.lat},${d.lng}&layer=c&cbll=${d.lat},${d.lng}`:null;
    let top='';
    if(d.image_url){
      if(exact){
        top=`<div class="pi two">
          <div class="piw"><img src="${esc(d.image_url)}" alt="" onload="this.classList.add('loaded')" onerror="this.parentElement.innerHTML='<span class=pph>No image</span>'"/><div class="pil">Official</div></div>
          <a class="piw pph" href="${esc(svUrl)}" target="_blank" rel="noopener">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>
            Compare &#x2192;<div class="pil">Street View</div>
          </a></div>
        <div class="ppn">&#128248; Promotional image &#8212; datacenters.com
          <a class="psv" href="${esc(svUrl)}" target="_blank" rel="noopener">Compare with Street View &#x2192;</a>
        </div>`;
      } else {
        top=`<div class="pi one"><div class="piw"><img src="${esc(d.image_url)}" alt="" onload="this.classList.add('loaded')" onerror="this.parentElement.innerHTML='<span class=pph>No image</span>'"/><div class="pil">Official</div></div></div>
        <div class="ppn">&#128248; Promotional image provided by datacenters.com</div>`;
      }
    }
    const dcLink=d.page_url?`<a class="plink" href="${esc(d.page_url)}" target="_blank" rel="noopener">datacenters.com <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>`:'';
    return `${top}<button class="px" onclick="document.getElementById('popup').style.display='none'">&#215;</button>
      <div class="ph"><div class="pn">${esc(d.name)}${badge}</div><div class="pc">${esc(d.country)}</div></div>
      <div class="pb">${addr}${chips?`<div class="pchips">${chips}</div>`:''}${desc}<div class="pacts">${dcLink}</div></div>`;
  }
  function showPopup(d,cx,cy){
    popupEl.innerHTML=buildPopup(d); popupEl.style.display='block';
    requestAnimationFrame(()=>{
      const pw=popupEl.offsetWidth||340,ph=popupEl.offsetHeight||420;
      let x=cx+18,y=cy-24;
      if(x+pw>window.innerWidth-8)  x=cx-pw-18;
      if(y+ph>window.innerHeight-8) y=window.innerHeight-ph-8;
      if(y<60)y=60; if(x<8)x=8;
      popupEl.style.left=x+'px'; popupEl.style.top=y+'px';
    });
  }

  function onPointClick(d,ev){
    const alt=world.pointOfView().altitude;
    pauseRotate();
    if(alt>CLUSTER_ALT){
      // Cluster: fly in to expand
      world.pointOfView({lat:d.lat,lng:d.lng,altitude:CLUSTER_ALT*0.55},800);

  function mklabels(arr,tier){return arr.map(([name,lat,lng])=>({name,lat,lng,tier}));}
  const CL1=mklabels(T1,'c1'), CL2=mklabels(T2,'c2'), CL3=mklabels(T3,'c3');
  let countryLabels=[];

  // ── Unified label builder (country names + city names + cluster counts) ───
  function buildAllLabels(alt, mode, clusters){
    let labels=[...countryLabels];
    if(mode==='cluster' && clusters.length){
      // Count numbers float above cluster dots
      labels=labels.concat(clusters.map(d=>({
        name:fmtCount(d.count), lat:d.lat, lng:d.lng, tier:'count'
      })));
    } else {
      // City labels when in individual mode
      if(alt<1.5) labels=labels.concat(CL1);
      if(alt<0.5) labels=labels.concat(CL2);
      if(alt<0.18)labels=labels.concat(CL3);
    }
    return labels;
  }

  function applyLabels(labels){
    world
      .labelsData(labels)
      .labelText('name')
      .labelSize(d=>({country:0.72,c1:0.50,c2:0.38,c3:0.28,count:0.48}[d.tier]||0.35))
      .labelColor(d=>({
        country:'rgba(200,215,230,0.82)',
        c1:'rgba(175,190,210,0.74)',
        c2:'rgba(150,168,190,0.65)',
        c3:'rgba(120,140,165,0.56)',
        count:'rgba(255,255,255,0.92)',
      }[d.tier]||'rgba(160,180,200,0.6)'))
      .labelAltitude(d=>d.tier==='count'?0.065:0.002)
      .labelResolution(2)
      .labelDotRadius(0);
  }

  function updateLegend(alt){
    const s=document.getElementById('precision-section'), h=document.getElementById('zoom-hint');
    s.style.opacity=alt<=CZ?'1':'0.4'; h.style.display=alt<=CZ?'none':'inline';
  }

  // ── Cluster mode helpers ──────────────────────────────────────────────────
  function buildClusters(points){
    const map={};
    points.forEach(d=>{
      if(!map[d.country])map[d.country]={lat:0,lng:0,count:0,country:d.country};
      map[d.country].lat+=d.lat; map[d.country].lng+=d.lng; map[d.country].count++;
    });
    return Object.values(map).map(c=>({...c,lat:c.lat/c.count,lng:c.lng/c.count}));
  }

  function showClusters(clusters){
    world
      .pointsData(clusters)
      .pointRadius(d=>Math.min(Math.sqrt(d.count)*0.12,3.5))
      .pointColor(()=>'#ffb946')
      .pointAltitude(0.005);
  }
  function showIndividual(points){
    world
      .pointsData(points)
      .pointRadius(0.22)
      .pointColor(d=>({address:'#00ff88',city:'#fbbf24',country:'#f87171'}[d.tier]||'#f87171'))
      .pointAltitude(0.008);
  }

  // ── Country polygon borders ───────────────────────────────────────────────
  fetch('https://cdn.jsdelivr.net/gh/datasets/geo-countries@master/data/countries.geojson')
    .then(r=>r.json())
    .then(gd=>{
      world.polygonsData(gd.features)
           .polygonCapColor(()=>'rgba(0,0,0,0)')
           .polygonSideColor(()=>'rgba(0,0,0,0)')
           .polygonStrokeColor(()=>'rgba(80,108,135,0.5)')
           .polygonAltitude(()=>0.001);
      countryLabels=gd.features.map(f=>{
        const name=f.properties.ADMIN||f.properties.name||'';
        if(!name||!f.geometry)return null;
        let ring;
        if(f.geometry.type==='Polygon') ring=f.geometry.coordinates[0];
        else if(f.geometry.type==='MultiPolygon') ring=f.geometry.coordinates.reduce((a,b)=>a[0].length>b[0].length?a:b)[0];
        else return null;
        if(!ring||ring.length<3)return null;
        const lat=ring.reduce((s,c)=>s+c[1],0)/ring.length;
        const lng=ring.reduce((s,c)=>s+c[0],0)/ring.length;
        return{name,lat,lng,tier:'country'};
      }).filter(Boolean);
      // Refresh labels now country names are available
      const alt=world.pointOfView().altitude;
      const mode=alt>CLUSTER_ALT?'cluster':'individual';
      applyLabels(buildAllLabels(alt,mode,currentClusters));
    })
    .catch(e=>console.warn('Country borders unavailable:',e));

  // ── Data loading ──────────────────────────────────────────────────────────
  let allPoints=[], currentFiltered=[], currentClusters=[];
  let countries=new Set(), countryCounts={};
  let lastMode='cluster';

  fetch('datacenters.geojson')
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(geojson=>{
      const feats=geojson.features||[], tiers={address:0,city:0,country:0};
      allPoints=feats.map(f=>{
        const p=f.properties,t=p.tier||'country';
        if(t in tiers)tiers[t]++;
        countries.add(p.country); countryCounts[p.country]=(countryCounts[p.country]||0)+1;
        return{lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],...p,
               _sp:parseSqft(p['total space']),_co:parseSqft(p['colocation space']),_pw:parseMW(p['total power'])};
      });
      currentFiltered=allPoints;
      currentClusters=buildClusters(allPoints);

      // Start in cluster mode
      showClusters(currentClusters);
      applyLabels(buildAllLabels(2.2,'cluster',currentClusters));
      updateLegend(2.2);

      document.getElementById('header-count').innerHTML=
        `<span>${feats.length.toLocaleString()}</span> data centers &middot; <span>${countries.size}</span> countries`;
      document.getElementById('cnt-address').textContent=tiers.address.toLocaleString();
      document.getElementById('cnt-city').textContent=tiers.city.toLocaleString();
      document.getElementById('cnt-country').textContent=tiers.country.toLocaleString();
      const total=feats.length;
      [['cov-space','total space'],['cov-colo','colocation space'],['cov-power','total power']].forEach(([id,key])=>{
        const n=allPoints.filter(d=>d[key]).length,pct=Math.round(n/total*100);
        const el=document.getElementById(id);
        el.textContent=pct+'% of DCs';
        el.className='cb '+(pct>=60?'hi':pct>=30?'me':'lo');
      });
      const sel=document.getElementById('country-select');
      [...countries].sort((a,b)=>{const d=(countryCounts[b]||0)-(countryCounts[a]||0);return d||a.localeCompare(b);})
        .forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c+' ('+(countryCounts[c]||0).toLocaleString()+')';sel.appendChild(o);});
    })
    .catch(err=>{document.getElementById('header-count').textContent='Could not load datacenters.geojson';console.error(err);});

  // ── Camera change → switch modes + update labels ──────────────────────────
  let labelRaf;
  world.controls().addEventListener('change',()=>{
    const alt=world.pointOfView().altitude;
    const mode=alt>CLUSTER_ALT?'cluster':'individual';

    if(mode!==lastMode){
      lastMode=mode;
      if(mode==='cluster'){
        showClusters(currentClusters);
      } else {
        showIndividual(currentFiltered);
      }
      updateLegend(alt);
    }

    // Throttle label updates
    cancelAnimationFrame(labelRaf);
    labelRaf=requestAnimationFrame(()=>applyLabels(buildAllLabels(alt,mode,currentClusters)));
  });

  // ── Search ────────────────────────────────────────────────────────────────
  const searchEl=document.getElementById('search'), clearBtn=document.getElementById('clear-btn');
  const dd=document.getElementById('search-dropdown');
  let searchTimer;
  const closeDD=()=>dd.style.display='none';
  const openDD=()=>dd.style.display='block';

  searchEl.addEventListener('input',()=>{
    clearTimeout(searchTimer);
    const q=searchEl.value.trim();
    clearBtn.style.display=q?'block':'none';
    if(!q){closeDD();applyFilters();return;}
    searchTimer=setTimeout(()=>buildDD(q),200);
  });
  searchEl.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDD();searchEl.blur();}});
  document.addEventListener('click',e=>{if(!document.getElementById('search-container').contains(e.target))closeDD();});

  function buildDD(q){
    const ql=q.toLowerCase(),parts=[];
    const cm=[...countries].filter(c=>c.toLowerCase().includes(ql)).sort((a,b)=>(countryCounts[b]||0)-(countryCounts[a]||0)).slice(0,5);
    if(cm.length){
      parts.push('<div class="sd-lbl">Countries</div>');
      cm.forEach(c=>parts.push(`<div class="sd-item" data-type="country" data-val="${esc(c)}"><span class="sd-name">${esc(c)}</span><span class="sd-meta">${(countryCounts[c]||0).toLocaleString()} DCs</span></div>`));
    }
    const dm=allPoints.filter(d=>d.name.toLowerCase().includes(ql)||(d.address||'').toLowerCase().includes(ql)).slice(0,5);
    if(dm.length){
      if(parts.length)parts.push('<div class="sd-div"></div>');
      parts.push('<div class="sd-lbl">Data Centers</div>');
      dm.forEach(d=>parts.push(`<div class="sd-item" data-type="dc" data-idx="${allPoints.indexOf(d)}"><span class="sd-name">${esc(d.name)}</span><span class="sd-meta">${esc(d.country)}</span></div>`));
    }
    if(!cm.length&&!dm.length)parts.push('<div class="sd-none">No matching countries or data centers</div>');
    parts.push(`<div class="sd-div"></div><div class="sd-place" id="sd-place"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>Search "<strong>${esc(q)}</strong>" as a place</div>`);
    dd.innerHTML=parts.join('');
    openDD();
    dd.querySelectorAll('.sd-item[data-type="country"]').forEach(el=>el.addEventListener('click',()=>{
      closeDD();searchEl.value=el.dataset.val;clearBtn.style.display='block';flyToCountry(el.dataset.val);
    }));
    dd.querySelectorAll('.sd-item[data-type="dc"]').forEach(el=>el.addEventListener('click',()=>{
      const d=allPoints[+el.dataset.idx];if(!d)return;
      closeDD();searchEl.value='';clearBtn.style.display='none';pauseRotate();
      world.pointOfView({lat:d.lat,lng:d.lng,altitude:0.08},1400);
      setTimeout(()=>showPopup(d,window.innerWidth/2,window.innerHeight/2+60),900);
    }));
    const pb=document.getElementById('sd-place');
    if(pb)pb.addEventListener('click',()=>nominatimFly(q));
  }

  function flyToCountry(country){
    document.getElementById('country-select').value=country;
    activeCountry=country; applyFilters();
    const pts=allPoints.filter(d=>d.country===country);
    if(!pts.length)return;
    const lats=pts.map(d=>d.lat),lngs=pts.map(d=>d.lng);
    const clat=(Math.min(...lats)+Math.max(...lats))/2, clng=(Math.min(...lngs)+Math.max(...lngs))/2;
    const span=Math.max(Math.max(...lats)-Math.min(...lats),Math.max(...lngs)-Math.min(...lngs));
    const alt=span>60?2.0:span>30?1.2:span>10?0.7:span>3?0.35:0.18;
    world.pointOfView({lat:clat,lng:clng,altitude:alt},1200);
  }

  function nominatimFly(q){
    closeDD();
    fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(q)+'&format=json&limit=1')
      .then(r=>r.json())
      .then(res=>{
        if(!res.length){alert('No place found for "'+q+'"');return;}
        const r=res[0],bb=r.boundingbox.map(parseFloat);
        const span=Math.max(bb[1]-bb[0],bb[3]-bb[2]);
        const alt=span>60?2.2:span>20?1.4:span>5?0.7:span>1?0.3:span>0.1?0.1:0.04;
        world.pointOfView({lat:(bb[0]+bb[1])/2,lng:(bb[2]+bb[3])/2,altitude:alt},1400);
      })
      .catch(()=>alert('Place search failed.'));
  }

  // ── Filter ────────────────────────────────────────────────────────────────
  let activeCountry='', activeSearch='';
  function getSpec(){
    const n=v=>v===''?null:+v;
    return{sp:{min:n(document.getElementById('space-min').value),max:n(document.getElementById('space-max').value),req:document.getElementById('space-req').checked},
           co:{min:n(document.getElementById('colo-min').value), max:n(document.getElementById('colo-max').value), req:document.getElementById('colo-req').checked},
           pw:{min:n(document.getElementById('power-min').value),max:n(document.getElementById('power-max').value),req:document.getElementById('power-req').checked}};
  }
  function okSpec(val,f){
    if(f.req&&val===null)return false;if(val===null)return true;
    if(f.min!==null&&val<f.min)return false;if(f.max!==null&&val>f.max)return false;
    return true;
  }
  function applyFilters(){
    const q=activeSearch.toLowerCase().trim(),s=getSpec();
    const m=allPoints.filter(d=>{
      if(activeCountry&&d.country!==activeCountry)return false;
      if(q&&![(d.name||''),(d.country||''),(d.address||'')].some(t=>t.toLowerCase().includes(q)))return false;
      return okSpec(d._sp,s.sp)&&okSpec(d._co,s.co)&&okSpec(d._pw,s.pw);
    });
    currentFiltered=m;
    currentClusters=buildClusters(m);
    const alt=world.pointOfView().altitude;
    const mode=alt>CLUSTER_ALT?'cluster':'individual';
    lastMode=mode;
    if(mode==='cluster') showClusters(currentClusters); else showIndividual(currentFiltered);
    applyLabels(buildAllLabels(alt,mode,currentClusters));
    popupEl.style.display='none';
    const hasF=q||activeCountry||Object.values(s).some(f=>f.min!==null||f.max!==null||f.req);
    const info=document.getElementById('result-info');
    if(hasF){info.style.display='block';info.textContent=m.length.toLocaleString()+' results';}
    else info.style.display='none';
  }

  clearBtn.addEventListener('click',()=>{searchEl.value='';activeSearch='';clearBtn.style.display='none';closeDD();applyFilters();});
  document.getElementById('country-select').addEventListener('change',e=>{
    if(e.target.value)flyToCountry(e.target.value);else{activeCountry='';applyFilters();}
  });
  document.getElementById('spec-toggle').addEventListener('click',function(){this.classList.toggle('open');document.getElementById('spec-panel').classList.toggle('open');});
  ['space-min','space-max','colo-min','colo-max','power-min','power-max'].forEach(id=>document.getElementById(id).addEventListener('input',applyFilters));
  ['space-req','colo-req','power-req'].forEach(id=>document.getElementById(id).addEventListener('change',applyFilters));
  document.getElementById('reset-btn').addEventListener('click',()=>{
    searchEl.value='';activeSearch='';activeCountry='';clearBtn.style.display='none';closeDD();
    document.getElementById('country-select').value='';
    document.getElementById('result-info').style.display='none';
    ['space-min','space-max','colo-min','colo-max','power-min','power-max'].forEach(id=>document.getElementById(id).value='');
    ['space-req','colo-req','power-req'].forEach(id=>document.getElementById(id).checked=false);
    currentFiltered=allPoints; currentClusters=buildClusters(allPoints); lastMode='cluster';
    showClusters(currentClusters);
    applyLabels(buildAllLabels(2.2,'cluster',currentClusters));
    popupEl.style.display='none';
    world.pointOfView({lat:20,lng:10,altitude:2.2},1200);
  });

}); // end load
</script>
</body>
</html>
